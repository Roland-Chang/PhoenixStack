# Managed by Ansible (PhoenixStack unbound role).
# Recursive resolver for Pi-hole on this guest only: it asks the root and authoritative
# servers itself and checks DNSSEC (trust anchor from Debian's root-auto-trust-anchor-file.conf).
# Based on https://docs.pi-hole.net/guides/dns/unbound/
server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.0/8 allow

    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # IPv6 is off in the lab.
    do-ip6: no
    prefer-ip6: no

    harden-glue: yes
    harden-dnssec-stripped: yes
    # Mixed-case queries break some authoritative servers.
    use-caps-for-id: no
    # Avoids fragmented UDP (DNS Flag Day 2020).
    edns-buffer-size: 1232
    # Refresh popular names before they expire, so they stay fast.
    prefetch: yes
    num-threads: 1
    # Public answers may not point into private ranges (DNS rebinding).
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
