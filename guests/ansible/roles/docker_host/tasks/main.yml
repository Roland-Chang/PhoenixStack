# Docker Engine and the Compose plugin from Docker's apt repository, with PhoenixStack daemon settings.
# Admins use `sudo docker`: membership of the docker group would be root without a password.
#
# A dry run on a brand-new guest can't see Docker's packages (the repository isn't added yet), so
# the steps that need Docker skip in that one case.

- name: Tools to check Docker's signing key and add its repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keyring folder
  ansible.builtin.file:
    path: "{{ docker_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Downloaded once: its fingerprint is pinned and checked below, so fetching it again gains nothing.
# (get_url also compares dates with Docker's server, and a re-published copy of the same key showed as a
# change in every dry run, 2026-11-23.) If Docker ever changes its key: the new fingerprint in
# defaults/main.yml, delete the file on the guest, run again.
- name: Is Docker's signing key there?
  ansible.builtin.stat:
    path: "{{ docker_key_path }}"
  register: docker_key_file

- name: Docker's signing key (downloaded once)
  ansible.builtin.get_url:
    url: "{{ docker_key_url }}"
    dest: "{{ docker_key_path }}"
    owner: root
    group: root
    mode: "0644"
  when: not docker_key_file.stat.exists

- name: The key is Docker's (fingerprint {{ docker_key_fingerprint }})
  ansible.builtin.command: gpg --show-keys --with-colons {{ docker_key_path }}
  register: docker_key_check
  changed_when: false
  check_mode: false
  failed_when: >-
    docker_key_check.rc != 0 or
    ('fpr:::::::::' ~ docker_key_fingerprint ~ ':') not in docker_key_check.stdout
  # A dry run on a new guest hasn't downloaded it.
  when: docker_key_file.stat.exists or not ansible_check_mode

- name: Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_repo_url }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: "{{ docker_key_path }}"
  register: docker_repo

- name: New-guest dry run (Docker's repository not added yet)
  ansible.builtin.set_fact:
    docker_dry_new: "{{ ansible_check_mode and docker_repo.changed }}"

- name: Docker Engine and Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_repo.changed }}"
  when: not docker_dry_new

- name: Docker settings folder
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Docker daemon settings (live-restore, no-new-privileges, capped logs, address pool)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: "{{ omit if docker_dry_new else 'dockerd --validate --config-file=%s' }}"
  notify: Restart docker

- name: Run Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when: not docker_dry_new

- name: Apply the daemon settings now (the stacks below need them)
  ansible.builtin.meta: flush_handlers

- name: Stacks folder
  ansible.builtin.file:
    path: "{{ docker_stacks_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
