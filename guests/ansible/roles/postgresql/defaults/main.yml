# PostgreSQL (L5c). Debian 13's own major version, so security updates come from Debian's
# security archive with the daily unattended upgrades (see guests/README.md, L5c).
postgresql_version: 17
postgresql_cluster: main
postgresql_conf_dir: "/etc/postgresql/{{ postgresql_version }}/{{ postgresql_cluster }}"

# New clusters are UTF-8 with PostgreSQL's builtin C.UTF-8 locale (sorting doesn't change with glibc
# updates). Without this, the cluster takes the guest's locale: C in a container, so SQL_ASCII,
# which Authentik (and most apps) can't use. Found in L5e, see guests/README.md.
postgresql_initdb_options: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8"

# Memory: a quarter of the guest's RAM for shared buffers, three quarters as the planner's
# estimate of the file cache. `memory` (MiB) comes from the inventory.
postgresql_shared_buffers_mb: "{{ (memory | int * 0.25) | int }}"
postgresql_effective_cache_mb: "{{ (memory | int * 0.75) | int }}"

# Database dump standard (guests/README.md, "Database dumps"): nightly at 06:30 UTC (23:30 Denver in
# winter, 00:30 in summer), before pve01's nightly-pbs job at 08:00 UTC. Seven day folders are kept
# on the guest.
postgresql_dump_dir: /var/backups/db-dump
postgresql_dump_time: "06:30"
postgresql_dump_keep_days: 7
