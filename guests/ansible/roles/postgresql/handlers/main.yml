# listen_addresses, shared_buffers and ssl changes need a restart; pg_hba.conf only a reload.
- name: Restart postgresql
  ansible.builtin.service:
    name: "postgresql@{{ postgresql_version }}-{{ postgresql_cluster }}"
    state: restarted
  when: not (ansible_check_mode and postgresql_packages.changed)

- name: Reload postgresql
  ansible.builtin.service:
    name: "postgresql@{{ postgresql_version }}-{{ postgresql_cluster }}"
    state: reloaded
  when: not (ansible_check_mode and postgresql_packages.changed)

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
