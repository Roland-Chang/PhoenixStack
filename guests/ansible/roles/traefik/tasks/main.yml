# Traefik as a compose stack in {{ traefik_dir }}, routes from the inventory as files. Needs the
# docker_host role first. Certificate (traefik_cert): acme = wildcard from Let's Encrypt over
# Cloudflare DNS-01 (docker01); origin_ca = Cloudflare Origin CA certificate and key (docker02).
#
# Secrets are written once, read with op read on this computer; dry runs and later runs don't read
# them. The Cloudflare token (1Password "(Cloudflare) - Traefik DNS Token") is written once, read with
# op read on this computer; dry runs and later runs don't read it. To rotate it: change the item,
# delete secrets/cloudflare-token on the guest, run again.

- name: Stack folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ traefik_dir }}", mode: "0755"}
    - {path: "{{ traefik_dir }}/dynamic", mode: "0755"}
    - {path: "{{ traefik_dir }}/letsencrypt", mode: "0700", when: "{{ traefik_cert == 'acme' }}"}
    - {path: "{{ traefik_dir }}/secrets", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"
  when: item.when | default(true) | bool

- name: Is the Cloudflare token there?
  ansible.builtin.stat:
    path: "{{ traefik_dir }}/secrets/cloudflare-token"
  register: traefik_token_file
  when: traefik_cert == 'acme'

- name: Cloudflare token (root only), from 1Password the first time
  ansible.builtin.copy:
    content: "{{ '(dry run: token not read)' if ansible_check_mode else lookup('ansible.builtin.pipe', 'op read ' ~ (traefik_op_cloudflare_token | quote)) }}"
    dest: "{{ traefik_dir }}/secrets/cloudflare-token"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: traefik_cert == 'acme' and not traefik_token_file.stat.exists
  notify: Restart traefik

# Origin CA (docker02). To renew or replace: change the 1Password item, delete both files on the
# guest, run again.
- name: Origin CA references are set
  ansible.builtin.assert:
    that: [traefik_op_origin_cert | length > 0, traefik_op_origin_key | length > 0]
    fail_msg: Set traefik_op_origin_cert and traefik_op_origin_key in the inventory (L5f step 2).
  when: traefik_cert == 'origin_ca' and not ansible_check_mode

- name: Are the Origin CA files there?
  ansible.builtin.stat:
    path: "{{ traefik_dir }}/secrets/{{ item }}"
  loop: [origin-cert.pem, origin-key.pem]
  register: traefik_origin_files
  when: traefik_cert == 'origin_ca'

- name: Origin CA certificate and key (root only), from 1Password the first time
  ansible.builtin.copy:
    content: "{{ '(dry run: not read)' if ansible_check_mode else lookup('ansible.builtin.pipe', 'op read ' ~ (item.ref | quote)) ~ '\n' }}"
    dest: "{{ traefik_dir }}/secrets/{{ item.file }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - {file: origin-cert.pem, ref: "{{ traefik_op_origin_cert }}", i: 0}
    - {file: origin-key.pem, ref: "{{ traefik_op_origin_key }}", i: 1}
  loop_control:
    label: "{{ item.file }}"
  no_log: true
  when: traefik_cert == 'origin_ca' and not traefik_origin_files.results[item.i].stat.exists
  notify: Restart traefik

- name: Origin CA certificate for every name
  ansible.builtin.template:
    src: tls.yml.j2
    dest: "{{ traefik_dir }}/dynamic/tls.yml"
    owner: root
    group: root
    mode: "0644"
  when: traefik_cert == 'origin_ca'

- name: No Origin CA file with Let's Encrypt
  ansible.builtin.file:
    path: "{{ traefik_dir }}/dynamic/tls.yml"
    state: absent
  when: traefik_cert != 'origin_ca'

- name: Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ traefik_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Static settings (traefik.yml)
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik

- name: Shared middlewares
  ansible.builtin.template:
    src: middlewares.yml.j2
    dest: "{{ traefik_dir }}/dynamic/middlewares.yml"
    owner: root
    group: root
    mode: "0644"

- name: Login through Authentik (when a route uses it)
  ansible.builtin.template:
    src: authentik.yml.j2
    dest: "{{ traefik_dir }}/dynamic/authentik.yml"
    owner: root
    group: root
    mode: "0644"
  when: traefik_authentik

- name: No Authentik login file when no route uses it
  ansible.builtin.file:
    path: "{{ traefik_dir }}/dynamic/authentik.yml"
    state: absent
  when: not traefik_authentik

- name: One route file per inventory route
  ansible.builtin.template:
    src: route.yml.j2
    dest: "{{ traefik_dir }}/dynamic/route-{{ route.name }}.yml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ routes | default([]) }}"
  loop_control:
    loop_var: route
    label: "{{ route.name }}"

- name: Route files on the guest
  ansible.builtin.find:
    paths: "{{ traefik_dir }}/dynamic"
    patterns: "route-*.yml"
  register: traefik_route_files

- name: Remove routes no longer in the inventory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ traefik_route_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  # route-<name>.yml → <name>
  when: >-
    (item.path | basename | splitext | first)[6:]
    not in (routes | default([]) | map(attribute='name') | list)

- name: Run the stack (docker compose up)
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
    pull: missing
    remove_orphans: true
  when: not docker_dry_new
