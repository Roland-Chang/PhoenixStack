# One compose stack per app listed in `apps` (see defaults/main.yml). Needs docker_host and traefik
# first (the "proxy" network), and nas_mount for apps that read the NAS.

- name: Known apps only
  ansible.builtin.assert:
    that: item in apps_catalog
    fail_msg: "{{ item }}: no entry in apps_catalog (roles/apps/defaults/main.yml)"
    quiet: true
  loop: "{{ apps }}"

- name: Stack folders
  ansible.builtin.file:
    path: "{{ apps_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ apps }}"

- name: Data folders, owned by the app's container user
  ansible.builtin.file:
    path: "{{ apps_dir }}/{{ item.0.key }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.value.uid }}"
    group: "{{ item.0.value.uid }}"
    mode: "0750"
  loop: "{{ apps_catalog | dict2items | selectattr('key', 'in', apps) | subelements('value.folders') }}"
  loop_control:
    label: "{{ item.0.key }}/{{ item.1 }}"

- name: Compose files
  ansible.builtin.template:
    src: "{{ item }}/compose.yml.j2"
    dest: "{{ apps_dir }}/{{ item }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ apps }}"
  register: apps_compose

# A dry run can't start a stack whose compose file it hasn't written.
- name: Run the stacks (docker compose up), wait until healthy
  community.docker.docker_compose_v2:
    project_src: "{{ apps_dir }}/{{ item.item }}"
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 300
  loop: "{{ apps_compose.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not docker_dry_new and not (ansible_check_mode and item.changed)
