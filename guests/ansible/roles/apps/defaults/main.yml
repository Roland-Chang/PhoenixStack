# Apps on a Docker host (L5f Step B): one compose stack per app in {{ apps_dir }}/<app>, reached by
# Traefik over the "proxy" network (route url http://<app>:<port>). The inventory lists a host's apps
# (apps: [audiobookshelf]); each app has templates/<app>/compose.yml.j2 and an entry in apps_catalog.
# Every app's containers get TZ from the inventory's `app_timezone` (schedules and logs in local time).
apps: []
apps_dir: /opt/stacks

# Staging copies (decision 11), on docker01 (Services, LAN and VPN only): [{app: audiobookshelf,
# version: "2.37.2"}], the version to try (empty: the app's pinned one). Stack <app>-staging, data
# restored from production's latest backup by hand (guests/README.md, "Staging"); no NAS (empty,
# read-only stand-ins for its folders, staging_folders below) until docker01 has NAS access.
apps_staging: []

# The admin apps that write to the NAS share Media (Sonarr, Radarr, SABnzbd, MeTube, libraforge; on docker01)
# run as one uid: the owner of docker01's writable Media mount (nas_mounts allows one owner per share), and
# so they can hand files to each other (download -> import). guests/README.md, "Admin apps to docker01".
apps_media_uid: 2010
# Where they find the NAS on docker01 (nas_mounts), and its downloads folder.
apps_media_root: /mnt/nas/media
apps_media_downloads: "/mnt/nas/media/###Downloads"

# Per app, everything its template needs:
#   uid              the uid its container runs as (no account on the host; its data folders belong to
#                    it, and a writable NAS share's `owner` in the inventory refers to it)
#   folders          its data folders inside the stack folder
#   staging_folders  a staging copy's empty stand-ins for its NAS folders
#   version          the pinned image version; a new one goes through staging first (decision 11)
#   folder_modes     a data folder's mode when it isn't 0750: {folder: "0700"}
#   env_op           secrets for the stack's .env (root only): {VARIABLE: "op://..."}, read from 1Password
#                    the first time only (dry runs never read them); env_op_staging for a staging copy.
#                    To rotate: change it in 1Password, delete the .env on the guest, run again.
apps_catalog:
  # Audiobookshelf. Same paths inside the container as on docker-temp (its database stores them).
  # Audiobooks read-only from the NAS (Media); podcasts read-write on the NAS share Podcasts (they're
  # downloaded; for Audiobookshelf's uid only); its own backups in /metadata/backups.
  audiobookshelf:
    uid: 2001
    folders: [config, metadata]
    staging_folders: [audiobooks, podcasts]
    version: "2.37.2"
    audiobooks: /mnt/nas/media/Books/Audiobooks
    podcasts: /mnt/nas/podcasts
  # Immich: one instance for everyone (guests/README.md, "Immich"). Four containers, all as `uid`, no
  # capabilities: the server (Traefik reaches it), machine learning, PostgreSQL and Redis (Valkey: its job
  # queues, not saved). PostgreSQL and Redis sit on the stack's internal network only. Media on the NAS share
  # Immich, mounted read-write for `uid` (nas_mounts); the same path inside the container as on docker-temp,
  # since the database stores every file's full path. The external library: Porter/PhotoArchive, read-only.
  # The database on docker02's disk (folder postgres); the model cache in ml-cache. No staging copy yet:
  # docker01 has no NAS.
  immich:
    uid: 2003
    folders: [postgres, ml-cache]
    folder_modes: {postgres: "0700"}   # PostgreSQL sets 0700 on its data folder at every start
    version: "v3.1.0"            # server and machine learning, always the same version
    postgres_image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0"
    # Valkey pinned by digest (checked on Docker Hub 2026-11-26: the tag 8.1.12-alpine is this digest).
    redis_image: "docker.io/valkey/valkey:8.1.12-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc"
    media: /mnt/nas/immich
    external_library: /mnt/nas/porter/PhotoArchive
    # 1Password "(Immich) - PostgreSQL" (user immich_db_user).
    env_op:
      DB_PASSWORD: "op://infrastructure/auflj3qq4awwxhyaibzm3g2ayy/password"

  # The admin apps on docker01 (guests/README.md, "Admin apps to docker01"): LAN and VPN only, behind Authentik
  # (admins). All as apps_media_uid, the owner of docker01's writable Media mount, with no capabilities;
  # LinuxServer's images need /run as a RAM folder of that uid to start without root. The same paths inside
  # the containers as on docker-temp (their databases store them): Media at /data/media1, its ###Downloads
  # folder at /data/downloads. They reach each other by container name (sonarr, radarr, sabnzbd, autobrr) on
  # the proxy network. Versions: the images docker-temp ran (same image IDs, checked 2026-11-27).
  sonarr:
    uid: "{{ apps_media_uid }}"
    folders: [config]
    version: "develop-5.0.0.2941-ls208"   # Sonarr v5, nightly branch; to stable later, through staging
    port: 8989
  radarr:
    uid: "{{ apps_media_uid }}"
    folders: [config]
    version: "6.4.4.10685-ls326"
    port: 7878
  sabnzbd:
    uid: "{{ apps_media_uid }}"
    folders: [config]
    version: "5.1.3-ls280"
    port: 8080
  autobrr:
    uid: "{{ apps_media_uid }}"
    folders: [config]
    version: "v1.90.0"
    port: 7474
  # MeTube (yt-dlp with a web page): downloads into Media's ###Downloads/ytdl. cookies holds browser cookies
  # for YouTube (a logged-in session, a credential): only on docker01's disk, never in git.
  metube:
    uid: "{{ apps_media_uid }}"
    folders: [state, cookies]
    version: "2026.11.06"
    port: 8081
  # libraforge (audiobook metadata for Audiobookshelf): works on Media's ###Prep/audiobook-dev input folder.
  # config holds its Audiobookshelf API key (abs.json) and Audible sign-ins (auth/): credentials, only on
  # docker01's disk. Published as `latest` only, so pinned by digest (the image docker-temp ran, 2026-11-03).
  libraforge:
    uid: "{{ apps_media_uid }}"
    folders: [config]
    version: "latest@sha256:4be9eea46da06cc72e2f1fce6af995a4c02388aded91e49d64792345c3eece65"
    port: 5056
  # Libation (downloads the Audible library, once a day): writes into Media's ###Downloads/libation. No web page,
  # so no route. config holds its database and the Audible sign-ins; config-internal its master key, which
  # decrypts those sign-ins (on docker-temp it lived inside the container only). Both credentials, only on
  # docker01's disk. 14.2.5 = the image docker-temp ran (`latest` there; `latest` now is a release candidate).
  libation:
    uid: "{{ apps_media_uid }}"
    folders: [config, config-internal]
    version: "14.2.5"
  # Open WebUI (L5h step 5): chat with the local models on ai01 (llama-server's OpenAI API; Ollama for
  # helper models). Its database on pgsql01 (openwebui, TLS); uploads, the document index and caches in
  # data. Runs as uid with group 0: the image makes its app and static folders group-0 writable for
  # that (it writes favicons and similar there at start). Logins through Authentik (OIDC, client
  # openwebui) only, on when env_op has OIDC_CLIENT_SECRET; Authentik's groups claim decides access
  # (allowed_groups) and who is an Open WebUI admin (admin_groups). password_login: its own form, the
  # way in when Authentik is down (turn it on here and run again).
  openwebui:
    uid: 2011
    folders: [data]
    version: "v0.13.5"
    port: 8080
    route: openwebui
    allowed_groups: [authentik Admins]        # family later: Young, Porter (and on the OIDC client)
    admin_groups: [authentik Admins]
    password_login: false
    openai_url: "http://ai01.int.phoenixstack.net:8080/v1"
    ollama_url: "http://ai01.int.phoenixstack.net:11434"
    # 1Password: "(Open WebUI) - PostgreSQL", "(Open WebUI) - Secret key", and "(Authentik) - Open WebUI
    # OIDC" (the client secret Authentik generated; copied into 1Password by hand).
    env_op:
      DB_PASSWORD: "op://infrastructure/nxx6ggspf33jfzzkw3j3zgxd4u/password"
      WEBUI_SECRET_KEY: "op://infrastructure/sehdjnsgvqr7sw5nqpywpn3xry/password"
      OIDC_CLIENT_SECRET: "op://infrastructure/2mjxb6yip5neuqyfl2pomtlxkm/password"
  # n8n (L5h step 5): automations, admins only. Its database on pgsql01 (n8n, TLS without certificate
  # checks, as Authentik: pgsql01 has Debian's self-signed certificate). Behind Authentik forward-auth,
  # then its own owner login (OIDC needs n8n's paid Enterprise licence). N8N_ENCRYPTION_KEY encrypts every
  # credential it stores: never change it. Runs history pruned after prune_hours.
  n8n:
    uid: 2012
    folders: [data]
    version: "2.49.8"
    port: 5678
    route: n8n
    prune_hours: 336                          # 14 days
    # 1Password: "(n8n) - PostgreSQL", "(n8n) - Encryption key" (owner login: "(n8n) - Owner login").
    env_op:
      DB_POSTGRESDB_PASSWORD: "op://infrastructure/gw2wglvujcbh4bqgl7krn24nsi/password"
      N8N_ENCRYPTION_KEY: "op://infrastructure/u3hhqeapmfjszpay5m5ahmos74/password"

  # IT-Tools: a static site served by nginx; no data, no settings, no login (public, decided 2026-11-25).
  # The image's nginx starts as root and hands off to its own user, so it keeps the four capabilities
  # that takes; its filesystem is read-only, with temporary folders for nginx's cache and run files.
  it-tools:
    folders: []
    version: "2024.10.22-7ca5933"

  # Mealie. Everything in /app/data (SQLite, recipe images, its own backups); nothing on the NAS.
  # route: its route name, for BASE_URL (the links Mealie sends: shares, invitations, password resets).
  # Logins through Authentik (OIDC), on when the stack's env_op has OIDC_CLIENT_SECRET: client ID = the
  # route name (staging: <route>-staging); Authentik generates the secret, copied by hand into 1Password.
  # Visitors go straight to Authentik (no Mealie login screen); new people get an account on first
  # login; existing accounts are matched by email; oidc_admin_group are Mealie admins.
  # password_login: Mealie's own form, at /login?direct=1. The way in when Authentik is down (the
  # break-glass admin svc_mealie): turn it back on here and run again.
  mealie:
    uid: 2002
    folders: [data]
    version: "v3.30.0"
    route: meal
    oidc_admin_group: authentik Admins
    password_login: false
    # Where new accounts go: this instance's group and household (by name). Mealie's defaults are
    # "Home" and "Family"; with no group "Home", logins through Authentik failed to create the account.
    default_group: Young Family
    default_household: Family
    # 1Password "(Authentik) - Mealie OIDC". A staging copy needs its own client (route <route>-staging)
    # and its secret in env_op_staging; without one, staging runs with Mealie's own logins.
    env_op:
      OIDC_CLIENT_SECRET: "op://infrastructure/parb3agp5afn7bdwf4r7pf5sly/password"
    env_op_staging: {}
