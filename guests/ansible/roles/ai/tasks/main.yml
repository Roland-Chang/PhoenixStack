# Local AI on ai01 (L5h). Debian's standard kernel, then NVIDIA's driver from NVIDIA's repository, held
# on one branch (see defaults/main.yml). The model servers come after the five stop/start cycles.

# --- Kernel ------------------------------------------------------------------------------------------
- name: Debian's standard kernel and its headers (the driver's module is built against them)
  ansible.builtin.apt:
    name: "{{ ai_kernel_packages }}"
    state: present
  register: ai_kernel

- name: Not the cloud kernel's metapackage any more (its kernels stay until autoremove)
  ansible.builtin.apt:
    name: linux-image-cloud-amd64
    state: absent
  # A dry run hasn't installed the standard kernel, so it mustn't plan to remove the other.
  when: not ansible_check_mode or ai_kernel is not changed

- name: Running kernel
  ansible.builtin.command: uname -r
  register: ai_running_kernel
  changed_when: false
  check_mode: false

# Same as plex01 (role plex): with both kernels at one version the boot menu lists the cloud kernel
# first, so boot the standard one once (grub-reboot), then remove the cloud kernels. Only while the
# cloud kernel runs, which is the first build only: nothing runs on ai01 yet then.
- name: Newest standard kernel installed
  ansible.builtin.shell: set -o pipefail; ls /boot/vmlinuz-*-amd64 | sed 's|/boot/vmlinuz-||' | sort -V
  args:
    executable: /bin/bash
  register: ai_std_kernel_all
  changed_when: false
  check_mode: false

# (Not grep -v in the pipeline: before a dry run installs it there's none, and grep then fails.)
- name: Newest standard kernel, if any
  ansible.builtin.set_fact:
    ai_std_kernel:
      stdout: "{{ ai_std_kernel_all.stdout_lines | reject('search', 'cloud') | list | last | default('') }}"

- name: Boot the standard kernel once, and reboot (first build only)
  when:
    - not ansible_check_mode
    - "'cloud' in ai_running_kernel.stdout"
    - ai_std_kernel.stdout | length > 0
  block:
    - name: Next boot into Linux {{ ai_std_kernel.stdout }}
      ansible.builtin.command:
        argv:
          - grub-reboot
          - "Advanced options for Debian GNU/Linux>Debian GNU/Linux, with Linux {{ ai_std_kernel.stdout }}"
      changed_when: true

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 600

    - name: Running kernel after the reboot
      ansible.builtin.command: uname -r
      register: ai_kernel_after_reboot
      changed_when: false
      failed_when: "'cloud' in ai_kernel_after_reboot.stdout"

- name: Kernel running now
  ansible.builtin.set_fact:
    ai_kernel_now: "{{ ai_kernel_after_reboot.stdout | default(ai_running_kernel.stdout) }}"

- name: Cloud kernels installed
  ansible.builtin.shell: dpkg-query -W -f '${Package}\n' 'linux-image-*-cloud-amd64' 2>/dev/null || true
  register: ai_cloud_kernels
  changed_when: false
  check_mode: false

- name: Remove the cloud kernels (none of them is running)
  ansible.builtin.apt:
    name: "{{ ai_cloud_kernels.stdout_lines }}"
    state: absent
    purge: true
  when:
    - ai_cloud_kernels.stdout_lines | length > 0
    - "'cloud' not in ai_kernel_now"

# --- NVIDIA's repository -----------------------------------------------------------------------------
- name: Tools to check NVIDIA's signing key and add its repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - python3-debian
    state: present

- name: Keyring folder
  ansible.builtin.file:
    path: "{{ ai_nvidia_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Is NVIDIA's signing key there?
  ansible.builtin.stat:
    path: "{{ ai_nvidia_key_path }}"
  register: ai_key_file

# Downloaded once; its fingerprint is pinned and checked below (as Plex's and Docker's).
- name: NVIDIA's signing key (downloaded once)
  ansible.builtin.get_url:
    url: "{{ ai_nvidia_key_url }}"
    dest: "{{ ai_nvidia_key_path }}"
    owner: root
    group: root
    mode: "0644"
  when: not ai_key_file.stat.exists

- name: The key is NVIDIA's (fingerprint {{ ai_nvidia_key_fingerprint }})
  ansible.builtin.command: gpg --show-keys --with-colons {{ ai_nvidia_key_path }}
  register: ai_key_check
  changed_when: false
  check_mode: false
  failed_when: >-
    ai_key_check.rc != 0 or
    ('fpr:::::::::' ~ ai_nvidia_key_fingerprint ~ ':') not in ai_key_check.stdout
  when: ai_key_file.stat.exists or not ansible_check_mode

# A flat repository (suite "/", no components), as NVIDIA publishes it.
- name: NVIDIA's apt repository (Debian 13)
  ansible.builtin.deb822_repository:
    name: nvidia-cuda
    types: deb
    uris: "{{ ai_nvidia_repo_url }}"
    suites: /
    signed_by: "{{ ai_nvidia_key_path }}"
  register: ai_repo

- name: Package lists, with NVIDIA's
  ansible.builtin.apt:
    update_cache: true
  when: ai_repo is changed and not ansible_check_mode

# --- Driver ------------------------------------------------------------------------------------------
# The pinning package first: without it apt would take the newest branch in the repository.
- name: Driver held on branch {{ ai_nvidia_branch }} (NVIDIA's pinning package)
  ansible.builtin.apt:
    name: "nvidia-driver-pinning-{{ ai_nvidia_branch }}"
    state: present
  when: not (ansible_check_mode and ai_repo is changed)

- name: NVIDIA driver, open kernel modules, headless
  ansible.builtin.apt:
    name: "{{ ai_nvidia_packages }}"
    state: present
    install_recommends: false
  register: ai_driver
  when: not (ansible_check_mode and ai_repo is changed)

# Keeps the GPU initialised between requests (no start-up delay for each model load).
- name: NVIDIA's persistence daemon
  ansible.builtin.systemd_service:
    name: nvidia-persistenced.service
    enabled: true
  when: not (ansible_check_mode and ai_repo is changed)

# A fresh module can't load until the next boot (the first build) or over the running one (an upgrade).
- name: Reboot to load the driver (only when it was just installed or changed)
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: ai_driver is changed and not ansible_check_mode

# --- GPU ---------------------------------------------------------------------------------------------
- name: The driver sees the GPU, on branch {{ ai_nvidia_branch }}
  ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version,memory.total,pcie.link.gen.max,pcie.link.width.max --format=csv,noheader
  register: ai_gpu
  changed_when: false
  check_mode: false
  failed_when: ai_gpu.rc != 0 or (', ' ~ ai_nvidia_branch ~ '.') not in ai_gpu.stdout
  when: not ansible_check_mode

- name: GPU
  ansible.builtin.debug:
    msg: "{{ ai_gpu.stdout | default('not checked in a dry run') }}"
