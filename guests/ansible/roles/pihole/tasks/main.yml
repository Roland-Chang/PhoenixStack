# Pi-hole v6 on Debian 13, installed unattended, with no blocklists, Unbound as upstream and the
# lab's local names. Needs the unbound role first.
#
# First run only: the web password is read from 1Password (op read, on this computer). Dry runs
# and later runs don't read it.
#
# In --check mode only the files before the install are checked: the settings are applied
# through Pi-hole's own command, which a dry run can't preview.

- name: Pi-hole's system user (owns /etc/pihole; the installer keeps it)
  ansible.builtin.user:
    name: pihole
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  register: pihole_user

# A dry run on a new guest only pretends to create the user, and files can't be checked against
# an owner that doesn't exist; the dry run checks them as root's instead.
- name: Owner of Pi-hole's files
  ansible.builtin.set_fact:
    pihole_owner: "{{ 'root' if (ansible_check_mode and pihole_user is changed) else 'pihole' }}"

- name: Pi-hole's config folder
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: "{{ pihole_owner }}"
    group: "{{ pihole_owner }}"
    mode: "0755"

- name: Is Pi-hole installed?
  ansible.builtin.stat:
    path: /usr/bin/pihole-FTL
  register: pihole_ftl

# The next two files only steer the first install. Afterwards FTL owns pihole.toml, and Pi-hole
# moves adlists.list into /etc/pihole/migration_backup/ when it builds its blocklist database.
- name: Empty blocklist file (without it, the unattended installer adds a default blocklist)
  ansible.builtin.copy:
    dest: /etc/pihole/adlists.list
    content: ""
    owner: "{{ pihole_owner }}"
    group: "{{ pihole_owner }}"
    mode: "0644"
    force: false
  when: not pihole_ftl.stat.exists

- name: Pre-seeded pihole.toml (without it, the installer asks questions)
  ansible.builtin.template:
    src: pihole.toml.j2
    dest: /etc/pihole/pihole.toml
    owner: "{{ pihole_owner }}"
    group: "{{ pihole_owner }}"
    mode: "0640"
    force: false
  when: not pihole_ftl.stat.exists

- name: Download the Pi-hole installer (pinned tag, checked)
  ansible.builtin.get_url:
    url: "{{ pihole_installer_url }}"
    dest: /root/pihole-basic-install.sh
    checksum: "sha256:{{ pihole_installer_sha256 }}"
    owner: root
    group: root
    mode: "0700"

- name: Install Pi-hole (once)
  ansible.builtin.command:
    cmd: bash /root/pihole-basic-install.sh --unattended
    creates: /usr/bin/pihole-FTL
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: pihole_install

# pihole-FTL --config writes pihole.toml (FTL reloads it). The file's header holds a time stamp,
# so "changed" compares the settings without comment lines.
- name: Pi-hole settings
  ansible.builtin.shell: |
    set -euo pipefail
    toml=/etc/pihole/pihole.toml
    before=$(grep -vE '^[[:space:]]*#' "$toml" | sha256sum)
    pihole-FTL --config {{ item.key | quote }} {{ (item.value if item.value is string else item.value | to_json) | quote }} >/dev/null
    after=$(grep -vE '^[[:space:]]*#' "$toml" | sha256sum)
    if [ "$before" != "$after" ]; then echo CHANGED; fi
  args:
    executable: /bin/bash
  loop: "{{ pihole_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: pihole_setting
  changed_when: "'CHANGED' in pihole_setting.stdout"
  notify: Restart pihole-FTL
  when: not ansible_check_mode

- name: Is the web password set?
  ansible.builtin.command: pihole-FTL --config webserver.api.pwhash
  register: pihole_pwhash
  changed_when: false
  when: not ansible_check_mode

# Without a password the web interface is open, so a new resolver gets one on its first run.
- name: Set the web password from 1Password (first run only)
  ansible.builtin.command:
    argv: [pihole, setpassword, "{{ lookup('ansible.builtin.pipe', 'op read ' ~ (pihole_op_password | quote)) }}"]
  no_log: true
  changed_when: true
  when:
    - not ansible_check_mode
    - pihole_pwhash.stdout | trim | length == 0

- name: Run Pi-hole
  ansible.builtin.service:
    name: pihole-FTL
    enabled: true
    state: started
  # A dry run before the install has no service to check yet.
  when: not (ansible_check_mode and pihole_install is changed)
