# Docker hosts (L5d): Docker Engine, then the internal Traefik. Run after site.yml has set up the guest.
# Always with --check --diff first.
#
#   apb docker.yml -l docker01 --check --diff
#   CLOUDFLARE_DNS_TOKEN="$(op read 'op://infrastructure/6jwbiosa4zf5wg32uh333srn2m/credential')" apb docker.yml -l docker01
#
# CLOUDFLARE_DNS_TOKEN is only needed the first time (or to rotate the token).
# After adding or removing a route in the inventory, also run dns.yml (one resolver at a time).

- name: Docker hosts
  hosts: docker*
  roles:
    - docker_host
    - traefik
