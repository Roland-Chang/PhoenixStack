# Local AI (L5h): ai01. Debian's standard kernel and NVIDIA's driver (role ai); the model servers come
# after the GPU has passed its five stop/start cycles. Run after site.yml has set up the guest. Always
# with --check --diff first.
#
#   apb ai.yml --check --diff
#   apb ai.yml
#
# The first real run installs the standard kernel and reboots into it, then installs the driver and
# reboots again to load it.

- name: Local AI
  hosts: ai01
  roles:
    - ai
