[defaults]
inventory = ../inventory.yml
roles_path = roles
interpreter_python = auto_silent
# Host keys are checked: a new guest's key is accepted once (accept-new, below); a changed
# key stops the run. After rebuilding a guest, remove its old key with ssh-keygen -R <ip>.
host_key_checking = True
retry_files_enabled = False
# SSH keys are in the 1Password agent, which asks before it signs. With several guests at once,
# the default 10 s wasn't enough to approve, and the run reported them unreachable (2026-11-22).
timeout = 60

[ssh_connection]
# One approved login per guest is reused for 15 minutes (one 1Password approval per session).
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=15m
pipelining = True
