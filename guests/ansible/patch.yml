# Weekly patch window for the guests: everything that isn't a Debian security update
# (those install daily by themselves, see the base role). One guest at a time.
# Run it in the same window as the host's patching, after pve01. Dry run first.
#
#   apb patch.yml --check --diff
#   apb patch.yml                    (all guests; -l dns01 for one)
#
# It also checks that each database guest dumped its databases last night.
#
# A guest reboots only when Debian asks for it (/var/run/reboot-required).

- name: Debian updates
  hosts: all
  serial: 1
  tasks:
    - name: Upgrade every package (apt full-upgrade)
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true

    - name: Does Debian ask for a reboot?
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot (only when Debian asks for it)
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists

- name: Pi-hole updates
  hosts: dns*
  serial: 1
  tasks:
    - name: Is a Pi-hole update available?
      ansible.builtin.command: pihole -up --check-only
      register: pihole_check
      changed_when: false
      # Read-only, so it runs in --check too and the dry run shows whether an update is due.
      check_mode: false

    - name: Pi-hole versions before (installed and latest)
      ansible.builtin.command: pihole version
      register: pihole_version_before
      changed_when: false
      check_mode: false

    - name: Show Pi-hole versions before
      ansible.builtin.debug:
        msg: "{{ pihole_version_before.stdout_lines + (pihole_check.stdout_lines | select('search', 'up to date') | list) }}"

    # pihole -up (v6.6) exits 1 after a successful core or FTL update (its update.sh ends the
    # installer call with "|| echo ... && exit 1"), so its exit code isn't trusted: the check
    # below decides whether the update worked.
    - name: Update Pi-hole (pihole -up)
      ansible.builtin.command: pihole -up
      register: pihole_update
      changed_when: true
      failed_when: false
      when: "'Everything is up to date' not in pihole_check.stdout"

    - name: Pi-hole is up to date afterwards
      ansible.builtin.command: pihole -up --check-only
      register: pihole_after
      changed_when: false
      failed_when: "'Everything is up to date' not in pihole_after.stdout"
      when: pihole_update is changed

    - name: Pi-hole versions after the update
      ansible.builtin.command: pihole version
      register: pihole_version_after
      changed_when: false
      when: pihole_update is changed

    - name: Show Pi-hole versions after the update
      ansible.builtin.debug:
        var: pihole_version_after.stdout_lines
      when: pihole_update is changed

    # The installer re-creates the default blocklist file on every update. Pi-hole doesn't read it
    # once its database exists; removing it keeps "no blocklists" unambiguous.
    - name: No blocklist file
      ansible.builtin.file:
        path: /etc/pihole/adlists.list
        state: absent

# Database dump standard (guests/README.md, "Database dumps"): every database guest writes
# last-ok after a good nightly dump. Older than 26 hours means last night's dump didn't happen.
- name: Database dumps are current
  hosts: pgsql*:mariadb*
  tasks:
    - name: When did the last dump succeed?
      ansible.builtin.stat:
        path: /var/backups/db-dump/last-ok
      register: db_dump_last_ok

    - name: Last night's dump succeeded (last-ok under 26 hours old)
      ansible.builtin.assert:
        that:
          - db_dump_last_ok.stat.exists
          - (ansible_facts['date_time']['epoch'] | int - db_dump_last_ok.stat.mtime | int) < 26 * 3600
        fail_msg: "No good dump in 26 hours: see 'journalctl -u db-dump' on {{ inventory_hostname }}"
        success_msg: "Last good dump: {{ '%Y-%m-%d %H:%M' | strftime(db_dump_last_ok.stat.mtime | int) }}"
