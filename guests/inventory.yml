# PhoenixStack guests: the one list both tools read.
#   Terraform (guests/terraform) creates each host below as a guest on pve01.
#   Ansible  (guests/ansible)   configures them; this file is its inventory.
# Design and address scheme: guests/README.md. Add a guest by adding one host entry, then
# follow the "New guest checklist" there (Terraform, Ansible, DNS name, UniFi alias, docs).
#
# Per host:
#   kind      lxc | vm
#   vmid      1XXYY (tier code XX, instance YY)
#   mac       02:aa:bb:cc:XX:YY (same code and instance)
#   ip        10.101.<zone>.<octet>; octet = code x 10 + instance (dns01 = .21), unique across zones
#   cores, memory (MiB), disk_gb, storage (ssd | nvme)   optional, defaults in terraform/main.tf
#   dns_servers   optional; the guest's DNS servers (default: the group's, else the gateway)
#   startup_order optional; boot order on pve01 (DNS 1, databases 2, the rest unset)
#   firewall_in   extra inbound rules: [{port: 53, proto: udp, source: lan}]; source is
#                 admin | lan | any | a CIDR. SSH and ping from admin sources are always allowed.
#   pg_databases  PostgreSQL hosts only: [{name, client, password}]. Database and owner role <name>,
#                 reachable over TLS from <client> (a /32) only; <password> is the op:// reference of
#                 its 1Password item, read once when the role is created. Open 5432 from <client> too.
#   routes        Docker hosts only: [{name, url, admin_only, self_signed, authentik, title,
#                 authentik_group}], names served by its Traefik (Pi-hole points <name>.<domain> at
#                 the guest). self_signed: the backend's HTTPS certificate isn't checked (firewall it
#                 to the Docker host instead). authentik: log in through Authentik first; the app
#                 (named title) lets in authentik_group only (default "authentik Admins").
all:
  vars:
    domain: int.phoenixstack.net
    # Admin sources: the same list as pve01's ADMIN_SOURCES (proxmox/config/pve01.conf)
    # and the UDM's Management rules. Keep the three in step.
    admin_sources: [10.1.1.69/32, 10.1.1.169/32, 10.2.1.69/32, 10.2.1.169/32, 192.168.2.0/24]
    # Home and VPN client networks ("lan" in firewall_in).
    lan_sources: [10.1.1.0/24, 10.2.1.0/24, 10.3.1.0/24, 192.168.2.0/24]
    # Public keys allowed to log in as the admin user (and as root on a new container).
    ssh_public_keys:
      - "ssh-rsa  pve01 root key"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILrvkAKsD6jDuWegn2puiYvJH1Uds+5W+jwteNwmILEm aaron@ayoung-lap"
    admin_user: aaron
    # DNS names that aren't guests in this file (Pi-hole serves these plus every guest's name).
    dns_records:
      pve01: 10.101.0.11
      # Service name apps connect to (guests/README.md, L5c): moves with the primary database.
      postgres: 10.101.1.71
    timezone: America/Denver
    # Ansible connects to the guest's static IP as the admin user. A brand-new container only
    # has root: the first run passes -e ansible_user=root (see guests/README.md).
    ansible_host: "{{ ip }}"
    ansible_user: "{{ admin_user }}"
    # sudo only when not already root (a new container has no sudo yet).
    ansible_become: "{{ ansible_user != 'root' }}"
  children:
    services:
      vars:
        zone: services
        vlan: 100
        gateway: 10.101.1.254
        # Guests ask Pi-hole: internal names are only there (the UDM has no local records).
        dns_servers: [10.101.1.21, 10.101.1.22]
      hosts:
        dns01:
          kind: lxc
          vmid: 10201
          mac: "02:aa:bb:cc:02:01"
          ip: 10.101.1.21
          dns_servers: [10.101.1.254]   # the resolvers themselves use the UDM, not each other
          startup_order: 1
          description: "DNS: Pi-hole with Unbound (L5b)"
          firewall_in:
            - {port: 53, proto: udp, source: lan}
            - {port: 53, proto: tcp, source: lan}
            - {port: 53, proto: udp, source: 10.101.1.0/24}   # Services guests
            - {port: 53, proto: tcp, source: 10.101.1.0/24}
            - {port: 443, proto: tcp, source: admin}
        # Second resolver on the same host: covers dns01's maintenance, not pve01's (decided 2026-11-21).
        dns02:
          kind: lxc
          vmid: 10202
          mac: "02:aa:bb:cc:02:02"
          ip: 10.101.1.22
          dns_servers: [10.101.1.254]   # the resolvers themselves use the UDM, not each other
          startup_order: 1
          description: "DNS: Pi-hole with Unbound (L5b), second resolver"
          firewall_in:
            - {port: 53, proto: udp, source: lan}
            - {port: 53, proto: tcp, source: lan}
            - {port: 53, proto: udp, source: 10.101.1.0/24}   # Services guests
            - {port: 53, proto: tcp, source: 10.101.1.0/24}
            - {port: 443, proto: tcp, source: admin}
        # PostgreSQL (L5c). Port 5432 opens per client, together with that client's database.
        pgsql01:
          kind: lxc
          vmid: 10701
          mac: "02:aa:bb:cc:07:01"
          ip: 10.101.1.71
          cores: 2
          memory: 2048
          disk_gb: 32
          storage: nvme
          startup_order: 2
          description: "Database: PostgreSQL 17 (L5c)"
          firewall_in:
            - {port: 5432, proto: tcp, source: 10.101.1.41/32}   # authentik01
          pg_databases:
            - name: authentik
              client: 10.101.1.41/32   # authentik01
              password: "op://infrastructure/b7ycchopd2lagrf3jg4samuk5q/password"
        # Docker host for Services (L5d): the internal Traefik and the apps behind it.
        docker01:
          kind: vm
          vmid: 11001
          mac: "02:aa:bb:cc:10:01"
          ip: 10.101.1.101
          cores: 8
          memory: 32768
          disk_gb: 64
          storage: nvme
          description: "Docker host, Services: internal Traefik and apps (L5d)"
          firewall_in:
            - {port: 443, proto: tcp, source: lan}
          # Names served by Traefik here: each becomes <name>.int.phoenixstack.net in Pi-hole
          # (pointing at this guest) and a route to <url>. admin_only: admin sources only.
          routes:
            - {name: traefik, url: "api@internal", admin_only: true, authentik: true, title: Traefik dashboard}
            - {name: auth, url: "https://10.101.1.41:9443", self_signed: true}   # authentik01
        # Identity provider (L5e): Authentik, behind docker01's Traefik as auth.int.phoenixstack.net.
        # Its database is on pgsql01 (pg_databases there); 9443 only from docker01.
        authentik01:
          kind: vm
          vmid: 10401
          mac: "02:aa:bb:cc:04:01"
          ip: 10.101.1.41
          cores: 2
          memory: 4096
          disk_gb: 32
          storage: nvme
          description: "Identity: Authentik (L5e)"
          firewall_in:
            - {port: 9443, proto: tcp, source: 10.101.1.101/32}   # docker01 (Traefik)
    dmz:
      vars:
        zone: dmz
        vlan: 200
        gateway: 10.101.2.254
      hosts: {}
