# PhoenixStack guests: the one list both tools read.
#   Terraform (guests/terraform) creates each host below as a guest on pve01.
#   Ansible  (guests/ansible)   configures them; this file is its inventory.
# Design and address scheme: guests/README.md. Add a guest by adding one host entry, then
# follow the "New guest checklist" there (Terraform, Ansible, DNS name, UniFi alias, docs).
#
# Per host:
#   kind      lxc | vm
#   vmid      1XXYY (tier code XX, instance YY)
#   mac       02:aa:bb:cc:XX:YY (same code and instance)
#   ip        10.101.<zone>.<octet>; octet = code x 10 + instance (dns01 = .21), unique across zones
#   cores, memory (MiB), disk_gb, storage (ssd | nvme)   optional, defaults in terraform/main.tf
#   data_disk_gb  VMs only, optional: a second disk (scsi1) for the app's data (grows online)
#   data_disk_storage, data_disk_backup   VMs only, optional: that disk's storage (default: storage)
#                 and whether nightly backups include it (default true)
#   numa_node     VMs only, optional: the pve01 NUMA node to keep the VM's memory on (0 = CPU 1, 1 = CPU 2)
#   cpu_type      VMs only, optional: the CPU model the guest sees (default x86-64-v2-AES; plex01 x86-64-v4
#                 for AVX2 and AVX-512, which software AV1 decoding needs)
#   gpu_mapping   VMs only, optional: a PCI device by its pve01 mapping name (GPU01 = the P2000)
#   dns_servers   optional; the guest's DNS servers (default: the group's, else the gateway)
#   startup_order optional; boot order on pve01 (DNS 1, databases 2, the rest unset)
#   firewall_in   extra inbound rules: [{port: 53, proto: udp, source: lan}]; source is
#                 admin | lan | cloudflare | any | a guest's name (its address) | a CIDR. SSH and ping from
#                 admin sources are always allowed. Every guest may only send from its own
#                 address (Proxmox IP filter), so a source address can be trusted.
#   pg_databases  PostgreSQL hosts only: [{name, client, password}]. Database and owner role <name>,
#                 reachable over TLS only from <client> (a guest in this file); <password> is the
#                 op:// reference of its 1Password item, read once when the role is created.
#                 Open 5432 from <client> in firewall_in too.
#   routes        Docker hosts only: names served by its Traefik as <name>.<routes_domain> (Pi-hole
#                 points the int. ones at the guest), each {name, url} plus, optionally:
#                   admin_only     admin sources only
#                   self_signed    the backend's HTTPS certificate isn't checked (firewall the backend
#                                  to the Docker host instead)
#                   authentik      log in through Authentik first (forward auth); the app, named
#                                  title, lets in authentik_group only (default "authentik Admins")
#                   oidc           the app logs in through its own OIDC support: a client in Authentik,
#                                  {title, redirects: [paths on the app's name], groups: [who may use it]}
#                   blocked_paths  path prefixes Traefik refuses (403) on that name
#   routes_domain Docker hosts only; the domain of its routes (default: domain). Pi-hole serves
#                 only routes under domain; public names come from Cloudflare's wildcard record.
#   apps          Docker hosts only: the apps run as compose stacks (role apps; their settings are
#                 apps_catalog in roles/apps/defaults/main.yml)
#   apps_staging  Docker hosts only: staging copies, [{app, version}] (decision 11; guests/README.md,
#                 "Staging")
#   nas_mounts    Docker hosts and plex01: NAS shares mounted inside the guest (role nas_mount) as the NAS
#                 user nas_username, whose password is the op:// reference nas_op_password.
#                 {share: Media, path: /mnt/nas/media} is read-only; rw: true and owner: <uid> make a
#                 share writable, for that uid only. On the NAS, the user may use only these shares.
all:
  vars:
    domain: int.phoenixstack.net
    # Public names (<app>.phoenixstack.net): the public Traefik on docker02, through Cloudflare's proxy.
    public_domain: phoenixstack.net
    # Cloudflare's IPv4 ranges (https://www.cloudflare.com/ips-v4, checked 2026-11-23): the only
    # sources docker02 accepts on 443 ("cloudflare" in firewall_in) and whose X-Forwarded-For
    # its Traefik trusts. The UDM's port forwards use the same list.
    cloudflare_sources:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
    # Admin sources: the same list as pve01's ADMIN_SOURCES (proxmox/config/pve01.conf)
    # and the UDM's Management rules. Keep the three in step.
    admin_sources: [10.1.1.69/32, 10.1.1.169/32, 10.2.1.69/32, 10.2.1.169/32, 192.168.2.0/24]
    # Home and VPN client networks ("lan" in firewall_in).
    lan_sources: [10.1.1.0/24, 10.2.1.0/24, 10.3.1.0/24, 192.168.2.0/24]
    # Public keys allowed to log in as the admin user (and as root on a new container).
    ssh_public_keys:
      # yamllint disable-line rule:line-length
      - "ssh-rsa  pve01 root key"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILrvkAKsD6jDuWegn2puiYvJH1Uds+5W+jwteNwmILEm aaron@ayoung-lap"
    admin_user: aaron
    # DNS names that aren't guests in this file (Pi-hole serves these plus every guest's name).
    dns_records:
      pve01: 10.101.0.11
      idrac-pve01: 10.101.0.1       # pve01's iDRAC (mgmt); self-signed certificate
      # Service name apps connect to (guests/README.md, L5c): moves with the primary database.
      postgres: 10.101.1.71
    # The NAS (UNAS Pro, mgmt): file shares that guests mount (nas_mounts), by address.
    nas_address: 10.101.0.101
    # Time zones (decided 2026-11-24): UTC for critical systems, local time only for user-facing apps
    # without a hard dependency on UTC.
    #   timezone      guests' clocks (role base) and infrastructure containers (Traefik); Authentik's
    #                 containers have no TZ at all (UTC, as its documentation requires)
    #   app_timezone  user-facing app containers (role apps), so their schedules and logs read in local time
    # pve01's clock is UTC too (proxmox/config/pve01.conf, TIMEZONE), its backup jobs scheduled in UTC.
    timezone: Etc/UTC
    app_timezone: America/Denver
    # Ansible connects to the guest's static IP as the admin user. A brand-new container only
    # has root: the first run passes -e ansible_user=root (see guests/README.md).
    ansible_host: "{{ ip }}"
    ansible_user: "{{ admin_user }}"
    # sudo only when not already root (a new container has no sudo yet).
    ansible_become: "{{ ansible_user != 'root' }}"
  children:
    services:
      vars:
        zone: services
        vlan: 100
        gateway: 10.101.1.254
        # Guests ask Pi-hole: internal names are only there (the UDM has no local records).
        dns_servers: [10.101.1.21, 10.101.1.22]
      hosts:
        dns01:
          kind: lxc
          vmid: 10201
          mac: "02:aa:bb:cc:02:01"
          ip: 10.101.1.21
          dns_servers: [10.101.1.254]   # the resolvers themselves use the UDM, not each other
          startup_order: 1
          description: "DNS: Pi-hole with Unbound (L5b)"
          firewall_in:
            - {port: 53, proto: udp, source: lan}
            - {port: 53, proto: tcp, source: lan}
            - {port: 53, proto: udp, source: 10.101.1.0/24}   # Services guests
            - {port: 53, proto: tcp, source: 10.101.1.0/24}
            - {port: 443, proto: tcp, source: admin}
        # Second resolver on the same host: covers dns01's maintenance, not pve01's (decided 2026-11-21).
        dns02:
          kind: lxc
          vmid: 10202
          mac: "02:aa:bb:cc:02:02"
          ip: 10.101.1.22
          dns_servers: [10.101.1.254]   # the resolvers themselves use the UDM, not each other
          startup_order: 1
          description: "DNS: Pi-hole with Unbound (L5b), second resolver"
          firewall_in:
            - {port: 53, proto: udp, source: lan}
            - {port: 53, proto: tcp, source: lan}
            - {port: 53, proto: udp, source: 10.101.1.0/24}   # Services guests
            - {port: 53, proto: tcp, source: 10.101.1.0/24}
            - {port: 443, proto: tcp, source: admin}
        # PostgreSQL (L5c). Port 5432 opens per client, together with that client's database.
        pgsql01:
          kind: lxc
          vmid: 10701
          mac: "02:aa:bb:cc:07:01"
          ip: 10.101.1.71
          cores: 2
          memory: 2048
          disk_gb: 32
          storage: nvme
          startup_order: 2
          description: "Database: PostgreSQL 17 (L5c)"
          firewall_in:
            - {port: 5432, proto: tcp, source: authentik01}
          pg_databases:
            - name: authentik
              client: authentik01
              password: "op://infrastructure/b7ycchopd2lagrf3jg4samuk5q/password"
        # Docker host for Services (L5d): the Services Traefik and the apps behind it.
        docker01:
          kind: vm
          vmid: 11001
          mac: "02:aa:bb:cc:10:01"
          ip: 10.101.1.101
          cores: 8
          memory: 32768
          disk_gb: 64
          storage: nvme
          description: "Docker host, Services: Traefik and apps (L5d)"
          firewall_in:
            - {port: 443, proto: tcp, source: lan}
          # Names served by Traefik here: each becomes <name>.int.phoenixstack.net in Pi-hole
          # (pointing at this guest) and a route to <url>. admin_only: admin sources only.
          # Apps on this host (role apps; their settings in roles/apps/defaults/main.yml).
          apps: [sonarr, radarr, sabnzbd, autobrr, metube, libraforge, libation]
          # NAS as svc_docker01 (1Password "(UNAS) - svc_docker01"): Media read-write for the admin apps' shared
          # uid (apps_media_uid), nothing else (2026-11-27; guests/README.md, "Admin apps to docker01").
          nas_username: svc_docker01
          nas_op_password: "op://infrastructure/iq2klbzio3ykym3bvpvrirzjtm/password"
          nas_mounts:
            - {share: Media, path: /mnt/nas/media, rw: true, owner: "{{ apps_media_uid }}"}
          routes:
            - {name: traefik, url: "api@internal", admin_only: true, authentik: true, title: Traefik dashboard}
            # The admin apps (moved from docker-temp 2026-11-27; guests/README.md, "Admin apps to docker01").
            - {name: sonarr, url: "http://sonarr:8989", admin_only: true, authentik: true, title: Sonarr}
            - {name: radarr, url: "http://radarr:7878", admin_only: true, authentik: true, title: Radarr}
            - {name: sabnzbd, url: "http://sabnzbd:8080", admin_only: true, authentik: true, title: SABnzbd}
            - {name: autobrr, url: "http://autobrr:7474", admin_only: true, authentik: true, title: autobrr}
            - {name: metube, url: "http://metube:8081", admin_only: true, authentik: true, title: MeTube}
            - {name: libraforge, url: "http://libraforge:5056", admin_only: true, authentik: true, title: libraforge}
            # authentik01's address typed out: other guests' roles read these routes (the authentik
            # role builds its apps from them), and there a {{ hostvars[...] }} reference can't resolve.
            - {name: auth, url: "https://10.101.1.41:9443", self_signed: true}
            # Staging copies (decision 11) go here when needed: a route <app>-staging (admin_only), and
            # apps_staging: [{app, version}] (role apps; guests/README.md, "Staging"). None now.
        # Identity provider (L5e): Authentik, behind docker01's Traefik as auth.int.phoenixstack.net.
        # Its database is on pgsql01 (pg_databases there); 9443 only from docker01.
        authentik01:
          kind: vm
          vmid: 10401
          mac: "02:aa:bb:cc:04:01"
          ip: 10.101.1.41
          cores: 2
          memory: 4096
          disk_gb: 32
          storage: nvme
          description: "Identity: Authentik (L5e)"
          firewall_in:
            - {port: 9443, proto: tcp, source: docker01}   # Services Traefik
            - {port: 9443, proto: tcp, source: docker02}   # public Traefik (auth.phoenixstack.net)
        # Local AI (L5h): Ollama (11434) and llama.cpp's llama-server (8080) with the RTX 5060 Ti (GPU02,
        # slot 1, CPU 1), so its memory stays on NUMA node 0. Models on their own disk on `data`, not backed
        # up (re-downloadable). Neither server has logins: only docker01 (Open WebUI, n8n) and the admin
        # sources reach them.
        ai01:
          kind: vm
          vmid: 11201
          mac: "02:aa:bb:cc:12:01"
          ip: 10.101.1.121
          cores: 12
          cpu_type: x86-64-v4
          memory: 98304
          numa_node: 0
          disk_gb: 32
          storage: nvme
          data_disk_gb: 256
          data_disk_storage: data
          data_disk_backup: false
          gpu_mapping: GPU02
          description: "Local AI: Ollama, llama-server (L5h)"
          firewall_in:
            - {port: 11434, proto: tcp, source: docker01}   # Open WebUI, n8n
            - {port: 11434, proto: tcp, source: admin}
            - {port: 8080, proto: tcp, source: docker01}
            - {port: 8080, proto: tcp, source: admin}
    dmz:
      vars:
        zone: dmz
        vlan: 200
        gateway: 10.101.2.254
      hosts:
        # Docker host for the DMZ (L5f): the public Traefik and the public apps behind it.
        # 443 from Cloudflare only; its routes are public names (routes_domain).
        docker02:
          kind: vm
          vmid: 11002
          mac: "02:aa:bb:cc:10:02"
          ip: 10.101.2.102
          cores: 8
          memory: 16384
          disk_gb: 128   # grown for the podcasts before they moved to the NAS (2026-11-24); disks don't shrink
          storage: nvme
          description: "Docker host, DMZ: public Traefik and apps (L5f)"
          firewall_in:
            - {port: 443, proto: tcp, source: cloudflare}
          routes_domain: phoenixstack.net
          # Cloudflare Origin CA certificate (phoenixstack.net, *.phoenixstack.net) instead of
          # Let's Encrypt: no Cloudflare token on this host. 1Password "(Cloudflare) - Origin CA
          # Certificate", two file attachments (PEM keeps its line breaks only in files, not in fields).
          traefik_cert: origin_ca
          traefik_op_origin_cert: "op://infrastructure/lztixhdcrujfgcjpqkqnzq2kym/origin-cert.pem"
          traefik_op_origin_key: "op://infrastructure/lztixhdcrujfgcjpqkqnzq2kym/origin-key.pem"
          # NAS as svc_docker02 (1Password "(UNAS) - svc_docker02"): Media read-only (it may only read it on
          # the NAS too); Podcasts read-write, for Audiobookshelf (uid 2001) only (share of its own, 2026-11-24);
          # Immich read-write for Immich (uid 2003) only, and Porter read-only for its external library
          # (shares and permissions 2026-11-25).
          nas_username: svc_docker02
          nas_op_password: "op://infrastructure/cxeg5kim7a3wfgxhhs4najt4ye/password"
          nas_mounts:
            - {share: Media, path: /mnt/nas/media}
            - {share: Podcasts, path: /mnt/nas/podcasts, rw: true, owner: "{{ apps_catalog.audiobookshelf.uid }}"}
            - {share: Immich, path: /mnt/nas/immich, rw: true, owner: "{{ apps_catalog.immich.uid }}"}
            - {share: Porter, path: /mnt/nas/porter}
          # Apps on this host (role apps; their settings in roles/apps/defaults/main.yml).
          apps: [audiobookshelf, mealie, it-tools, immich]
          routes:
            # Authentik's public name; its admin pages stay LAN and VPN only (auth.int).
            - {name: auth, url: "https://10.101.1.41:9443", self_signed: true, blocked_paths: ["/if/admin"]}
            # oidc: an OIDC client in Authentik for the app's own login (role authentik).
            - name: abs                # Audiobookshelf (moved 2026-11-24)
              url: "http://audiobookshelf:80"
              oidc:
                title: Audiobookshelf
                redirects: [/auth/openid/callback, /auth/openid/mobile-redirect]
                groups: [authentik Admins, Family]
            - name: meal                 # Mealie (moved 2026-11-25)
              url: "http://mealie:9000"
              oidc:
                title: Mealie
                redirects: [/login]
                groups: [authentik Admins, Family]
            - {name: tools, url: "http://it-tools:80"}              # IT-Tools (moved 2026-11-25), public
            # Immich (moved 2026-11-26). Its docker-temp name until it's renamed with the Porter users.
            - {name: immich-p, url: "http://immich-server:2283"}
        # Media server (L5g, designed 2026-11-26): replaces PLEX-TEMP (stopped). Plex, natively; its data on
        # its own disk; media read-only at /content (the path every library uses). The GPU (gpu_mapping:
        # GPU01) is here now; it belongs to one running VM, so PLEX-TEMP can't be started while plex01 runs.
        plex01:
          kind: vm
          vmid: 10601
          mac: "02:aa:bb:cc:06:01"
          ip: 10.101.2.61
          # 6 cores and x86-64-v4 (2026-11-27): the P2000 can't decode AV1, so AV1 sources decode on
          # the CPU, which is much faster with AVX2 and AVX-512.
          cores: 6
          cpu_type: x86-64-v4
          memory: 12288
          disk_gb: 32
          data_disk_gb: 64
          storage: nvme
          gpu_mapping: GPU01
          description: "Media server, DMZ: Plex (L5g)"
          firewall_in:
            - {port: 32400, proto: tcp, source: any}
          # NAS as svc_plex01 (1Password "(UNAS) - svc_plex01"): Media read-only, nothing else.
          nas_username: svc_plex01
          nas_op_password: "op://infrastructure/2ysigwqdmsfi3u7g3o3hm2gfhy/password"
          nas_mounts:
            - {share: Media, path: /content}
          # Plex runs (since the switch, 2026-11-27); role plex: it starts only with its Preferences.xml.
          plex_enabled: true
