# Ansible Inventory
# Defines hosts and groups for Ansible provisioning

all:
  hosts:
    pve01:
      ansible_host: 10.101.0.11
      ansible_port: 22
      ansible_user: root
      description: "Proxmox VE hypervisor node"
      hostname: pve01

    bastion01:
      ansible_host: 10.101.0.20
      ansible_port: 22
      ansible_user: root
      container_role: orchestration
      vlan: management
      description: "Bastion host (Ansible orchestration, GitHub Actions runner, jump box)"
      hostname: bastion01

    bastion02:
      ansible_host: 10.101.0.21
      ansible_port: 22
      ansible_user: root
      container_role: orchestration
      vlan: management
      description: "Secondary bastion (redundancy, load distribution)"
      hostname: bastion02

    dns01:
      ansible_host: 10.101.0.201
      ansible_port: 22
      ansible_user: root
      container_role: dns
      vlan: management
      description: "DNS server (PiHole, ad blocking, local domain resolution)"
      hostname: dns01

    dns02:
      ansible_host: 10.101.0.202
      ansible_port: 22
      ansible_user: root
      container_role: dns
      vlan: management
      description: "DNS server secondary (PiHole backup, redundancy)"
      hostname: dns02

    proxy01:
      ansible_host: 10.101.0.31
      ansible_port: 22
      ansible_user: root
      container_role: proxy
      vlan: management
      description: "Reverse proxy (Traefik, ingress routing)"
      hostname: proxy01

    pgsql01:
      ansible_host: 10.101.0.71
      ansible_port: 22
      ansible_user: root
      container_role: database
      vlan: management
      description: "PostgreSQL database primary (HA cluster)"
      hostname: pgsql01

    pgsql02:
      ansible_host: 10.101.0.72
      ansible_port: 22
      ansible_user: root
      container_role: database
      vlan: management
      description: "PostgreSQL database standby (HA cluster, streaming replication)"
      hostname: pgsql02

    authentik01:
      ansible_host: 10.101.0.41
      ansible_port: 22
      ansible_user: root
      container_role: identity
      vlan: management
      description: "Authentik SSO primary"
      hostname: authentik01

    authentik02:
      ansible_host: 10.101.0.42
      ansible_port: 22
      ansible_user: root
      container_role: identity
      vlan: management
      description: "Authentik SSO standby"
      hostname: authentik02

    plex01:
      ansible_host: 10.101.1.61
      ansible_port: 22
      ansible_user: root
      container_role: media
      vlan: workload
      description: "Plex media server primary"
      hostname: plex01

    plex02:
      ansible_host: 10.101.1.62
      ansible_port: 22
      ansible_user: root
      container_role: media
      vlan: workload
      description: "Plex media server secondary"
      hostname: plex02

    amp01:
      ansible_host: 10.101.1.81
      ansible_port: 22
      ansible_user: root
      container_role: gameserver
      vlan: workload
      description: "AMP game server primary (CubeCoders)"
      hostname: amp01

    amp02:
      ansible_host: 10.101.1.82
      ansible_port: 22
      ansible_user: root
      container_role: gameserver
      vlan: workload
      description: "AMP game server secondary (CubeCoders)"
      hostname: amp02

    docker01:
      ansible_host: 10.101.1.51
      ansible_port: 22
      ansible_user: root
      container_role: compute
      vlan: workload
      description: "Docker container host 1"
      hostname: docker01

    docker02:
      ansible_host: 10.101.1.52
      ansible_port: 22
      ansible_user: root
      container_role: compute
      vlan: workload
      description: "Docker container host 2"
      hostname: docker02
  vars:
    # Ansible behavior
    ansible_python_interpreter: /usr/bin/python3
    ansible_connection: ssh

    # System configuration
    domain: phoenix.stack
    timezone: UTC
    search_domains:
      - phoenix.stack

    # Package management
    apt_cache_valid_time: 3600
    apt_autofix_interrupted_dpkg: true
    apt_autoclean_cache: true

    # Security
    ssh_key_bits: 4096
    ssh_enabled: true
    password_auth_disabled: true

    # Container-specific
    container_type: lxc
    os_family: ubuntu
    os_version: "24.04"

# control_plane:
  # hosts:
    # bastion01:
    # bastion02:

bastion:
  hosts:
    bastion01:
    bastion02:

dns:
  hosts:
    dns01:
    dns02:

proxy:
  hosts:
    proxy01:

databases:
  children:
    pgsql:
      hosts:
        pgsql01:
        pgsql02:
    sql:
      hosts:
    mariadb:
      hosts:

monitoring:
  hosts:

vault:
  hosts:

backup:
  hosts:

identity:
  hosts:
    authentik01:
    authentik02:

media:
  children:
    plex:
      hosts:
        plex01:
        plex02:

gameserver:
  children:
    amp:
      hosts:
        amp01:
        amp02:

compute:
  children:
    docker:
      hosts:
        docker01:
        docker02:
