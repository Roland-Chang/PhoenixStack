    # System configuration
    domain: phoenix.stack
    timezone: UTC
    search_domains:
      - phoenix.stack

    # Package management
    apt_cache_valid_time: 3600
    apt_autofix_interrupted_dpkg: true
    apt_autoclean_cache: true

    # Security
    ssh_key_bits: 4096
    ssh_enabled: true
    password_auth_disabled: true

    # Container-specific
    container_type: lxc
    os_family: ubuntu
    os_version: "24.04"

