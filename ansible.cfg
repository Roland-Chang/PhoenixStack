[defaults]
inventory = ./ansible/inventory/hosts.yml
roles_path = ./ansible/roles
private_key_file = ~/.ssh/id_rsa
host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

# Parallel execution settings for faster deployments
# Phase 0 (common_base_setup.yml) will execute all hosts in parallel (respects forks)
forks = 16
# Run up to 16 hosts in parallel (increase if you have more)
strategy = linear
# Use 'linear' for ordered execution per host, 'free' for truly parallel
strategy_plugins = /usr/share/ansible/plugins/strategy

# For even faster parallel execution, uncomment strategy = free
# Note: 'free' strategy may cause issues if tasks have dependencies
# strategy = free

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
