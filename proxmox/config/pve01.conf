# =============================================================================
# PhoenixStack node config: pve01
#
# Single source of truth for prepare-iso.sh, pre-rebuild.sh and pve-bootstrap.sh.
# Bash syntax (sourced). NO SECRETS in this file — passwords and tokens are
# prompted at run time (or read from env vars) and never written to the repo.
#
# Lines containing REPLACE_ME must be filled in before use; the scripts refuse
# to run while any remain. Most values come from `pre-rebuild.sh --capture`.
# =============================================================================

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
NODE_NAME="pve01"
NODE_DOMAIN="int.phoenixstack.net"     # internal names; real TLS via Cloudflare DNS-01
TIMEZONE="America/Denver"
ROOT_EMAIL="accounts@phoenixstack.net"                # root@pam notifications (installer 'mailto')

# Installer locale
INSTALL_KEYBOARD="en-us"
INSTALL_COUNTRY="us"

# ---------------------------------------------------------------------------
# Boot disks (installer). The filter must match EXACTLY the two Intel SSDs.
# prepare-iso.sh runs `device-match` to prove it before building the ISO.
# ---------------------------------------------------------------------------
INSTALL_DISK_FILTER="ID_MODEL=INTEL_SSDSC2BF240A4L"
INSTALL_ZFS_RAID="raid1"               # mirror

# ZFS ARC cap (GiB). Host has 251 GiB; leave the rest for guests.
ZFS_ARC_MAX_GIB=24

# ---------------------------------------------------------------------------
# Management network (VLAN 10 is native/untagged on the switch port)
# ---------------------------------------------------------------------------
MGMT_CIDR="10.101.0.11/23"
MGMT_GATEWAY="10.101.0.254"
MGMT_VLAN=""                           # empty = host IP untagged on vmbr0 (native VLAN)
DNS_SERVERS="10.101.0.254 1.1.1.1"     # UDM first (local records), Cloudflare fallback
NTP_SERVERS="time.cloudflare.com"

# Uplink NIC(s) identified by MAC, not name, so interface renames can't bite.
# Onboard Broadcom BCM57416 dual 10GBASE-T (RJ45, Cat6a). Switch side: SFP+ -> 10GBASE-T
# module in the USW Aggregation. The T640 GPU kit's external fans cover the rear opening of
# every PCIe slot except slot 4 (Ext L leaves it open). The Intel X520 SFP+ is removed and
# slot 4 is kept free as the only home for a future card that needs a cable.
# MACs from the iDRAC inventory (NIC.Embedded.1-1-1 / NIC.Embedded.2-1-1), 2026-11-14.
#   Port 1: 4C:D9:8F:0C:15:3E   (uplink today)
#   Port 2: 4C:D9:8F:0C:15:3F   (add here + set 802.3ad for a LAG later)
UPLINK_MACS="4C:D9:8F:0C:15:3E"
BOND_MODE="active-backup"              # active-backup | 802.3ad (needs switch LAG)
BRIDGE_VIDS="2-4094"                   # VLANs allowed on vmbr0 (switch port profile also limits)

# Admin source networks allowed to reach the GUI (8006), SSH and SPICE.
# Everything else inbound to the host is dropped.
ADMIN_SOURCES=(
  # Not the mgmt subnet: UniFi DHCP gives guests addresses there (10.101.0.0/23), and
  # guests must not reach the host's admin ports. Add specific admin hosts as /32s.
  "10.1.1.0/24|admin workstation LAN"
)

# Kernel command line additions
#   intel_iommu=on iommu=pt  GPU passthrough
#   l1tf=flush,nowarn        same L1TF mitigation as the default ("flush"); only stops KVM's
#                            per-boot "L1TF CPU bug present and SMT on" warning. Accepted
#                            risk R2 in ../README.md: remove it if R2 is revisited.
KERNEL_CMDLINE_ADD="intel_iommu=on iommu=pt l1tf=flush,nowarn"

# Quadro P2000 for passthrough to the Plex VM (all functions bound to vfio-pci, by device ID,
# so a host-driven 3070 later is unaffected). Leave empty to skip GPU passthrough setup.
# Slot 8 (moved from slot 3, where it was 0000:3b:00). iDRAC 2026-11-14 14:18: "GPU Controller
# in Slot 8", bus 177 = 0xb1 → CPU 2. If cards change, re-check with `lspci | grep -i nvidia`.
GPU_PCI_ADDR="0000:b1:00"
# Cluster resource mapping name for that GPU. Guests use "hostpci0: mapping=GPU01"
# (PLEX-TEMP's restored config expects this name). Empty = no mapping.
GPU_MAPPING_ID="GPU01"

# ---------------------------------------------------------------------------
# Root SSH keys (public keys only). Used by the installer and the bootstrap.
# ---------------------------------------------------------------------------
ROOT_SSH_KEYS=(
  "ssh-rsa "   # e.g. "ssh-ed25519 AAAA... aaron@workstation"
)

# ---------------------------------------------------------------------------
# Guest + backup ZFS pools (created by the 'storage' stage)
# Disks by /dev/disk/by-id — verify with: ls -l /dev/disk/by-id/
# ---------------------------------------------------------------------------
ZFS_POOLS="nvme ssd backup"

# 2x Micron 7300 PRO 960G NVMe — VM disks. Enterprise drives with power-loss protection.
# Each on its own single M.2 adapter (heatsinks fitted): slots 5 and 7, so the mirror
# survives an adapter failure. by-id paths follow the drive, not the slot.
ZFS_POOL_nvme_LAYOUT="mirror
  /dev/disk/by-id/nvme-Micron_7300_MTFDHBA960TDF_20222D84258A
  /dev/disk/by-id/nvme-Micron_7300_MTFDHBA960TDF_20222D8418A0"
ZFS_POOL_nvme_PROPS=""

# 2 of the 4x Micron 256G SATA SSDs — small general tier (~238G): templates, light
# containers. Interim until the 'data' pool arrives; can be retired after that.
ZFS_POOL_ssd_LAYOUT="mirror
  /dev/disk/by-id/ata-MTFDDAK256MAM-1K12_14100C07C394
  /dev/disk/by-id/ata-MTFDDAK256MAM-1K12_14100C077C18"
ZFS_POOL_ssd_PROPS=""

# 4x Seagate 1.2TB SAS — backup tier for Proxmox Backup Server
# (MegaRAID must be in eHBA/JBOD mode so ZFS sees raw disks)
# + the other 2 Micron 256G SATA SSDs as a mirrored SPECIAL vdev: all pool metadata lives
#   on SSD, so PBS garbage collection, verify and browsing don't crawl on spinning disks.
#   It is pool-critical (losing both SSDs loses the pool), hence the mirror. It must exist
#   when the pool is created: metadata written before it was added stays on the HDDs.
#   Metadata only (special_small_blocks unset). zpool create -f accepts the mixed layout.
ZFS_POOL_backup_LAYOUT="raidz1
  /dev/disk/by-id/wwn-0x5000c500a7c0f787
  /dev/disk/by-id/wwn-0x5000c500a7c0fb07
  /dev/disk/by-id/wwn-0x5000c500a7c102d7
  /dev/disk/by-id/wwn-0x5000c500a7c0f7cb
special mirror
  /dev/disk/by-id/ata-MTFDDAK256MAM-1K12_14100C07790A
  /dev/disk/by-id/ata-MTFDDAK256MAM-1K12_14100C0778A5"
ZFS_POOL_backup_PROPS="compression=zstd"

# FUTURE — 'data' pool: Samsung 990 Pro 1TB drives on the ASUS Hyper M.2 card (slot 3, CPU1,
# same CPU as the 3070 in slot 1). LLM models, containers, general storage. Grown in place:
#   1 drive  → single disk, NO redundancy (models only until drive 2)   ~0.9 TB
#   2 drives → `zpool attach` makes it a mirror                          ~0.9 TB
#   4 drives → `zpool add ... mirror` adds a second mirror               ~1.8 TB
# The bootstrap only CREATES pools; steps 2 and 4 are manual — see "The data pool" in
# ../README.md — then update this layout so the config matches the host.
# Created after the install: fill the by-id path, uncomment this block and the matching
# lines below, add 'data' to ZFS_POOLS, then run --apply --stage storage.
# ZFS_POOL_data_LAYOUT="
#   /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_1TB_REPLACE_ME"
# Final 4-drive layout, for reference:
#   mirror <990-1> <990-2>
#   mirror <990-3> <990-4>
# ZFS_POOL_data_PROPS=""

# Extra datasets: "name prop=value ..."
ZFS_DATASETS=(
  "backup/pbs recordsize=1M"
  # FUTURE (with the data pool): model files are large, written once, already compressed.
  # primarycache=metadata keeps a 60 GB model load from flushing VM data out of the ARC.
  # "data/models recordsize=1M compression=off primarycache=metadata quota=600G"
)

# Cap the boot pool's /var/lib/vz so it can't fill the OS disks again (was 257G).
LOCAL_VZ_QUOTA="32G"
LOCAL_CONTENT="iso,vztmpl,snippets"
REMOVE_LOCAL_ZFS="yes"                 # no guest disks on the boot pool

# Proxmox storage entries for the guest pools: "id|pool|content"
PVE_ZFS_STORAGES=(
  "nvme|nvme|images,rootdir"
  "ssd|ssd|images,rootdir"
  # "data|data|images,rootdir"         # FUTURE: with the data pool
)

# ---------------------------------------------------------------------------
# NAS (UniFi UNAS Pro) — CIFS mounts managed in /etc/fstab
#   "id|share/path|pve-content-or-none|mount-opts-override"
# Mounted at /mnt/nas/<id>. Content 'none' = host mount only (e.g. LXC bind mounts).
# Password prompted at apply (or env NAS_SMB_PASSWORD); stored root-only on host.
# ---------------------------------------------------------------------------
NAS_SERVER="10.101.0.101"
NAS_SMB_USER="svc_proxmox"
NAS_SMB_VERSION="3.1.1"
NAS_MOUNTS=(
  "nas-iso|Media/Software/ISO|iso,vztmpl|"
  "nas-dump|Backups/pve01|backup|"
  # Host-only mounts (no PVE storage) bind-mounted read-write into unprivileged
  # docker-temp (999). Owner = container root (100000), group = container gid 1000
  # (101000), so its apps can write (Immich keeps its library on Porter).
  "media|Media|none|uid=100000,gid=101000,file_mode=0770,dir_mode=0770"
  "porter|Porter|none|uid=100000,gid=101000,file_mode=0770,dir_mode=0770"
)
# Retention for nas-dump: the nightly off-host disaster-recovery copy (full vzdump archives;
# the long history lives in the local PBS). 7 nightly fulls — size the NAS share for ~7x the
# compressed size of all guests. See "Backup design" in ../README.md.
NAS_DUMP_PRUNE="keep-daily=7"

# ---------------------------------------------------------------------------
# Access: people, roles, service accounts
# ---------------------------------------------------------------------------
# Personal admins (pve realm, member of 'admins' → Administrator on /).
# Password is prompted when the user is created; enroll TOTP in the GUI after.
ADMIN_USERS=(
  "aaron@pve|ayoung@phoenixstack.net|Aaron Young"   # userid|email|full name
)

# Custom roles: "name|priv,priv,..."  (unknown privileges are dropped with a warning)
PVE_ROLES=(
  "PhoenixTerraform|Datastore.Allocate,Datastore.AllocateSpace,Datastore.AllocateTemplate,Datastore.Audit,Mapping.Audit,Mapping.Use,Pool.Allocate,Pool.Audit,SDN.Audit,SDN.Use,Sys.Audit,Sys.Console,Sys.Modify,VM.Allocate,VM.Audit,VM.Clone,VM.Config.CDROM,VM.Config.CPU,VM.Config.Cloudinit,VM.Config.Disk,VM.Config.HWType,VM.Config.Memory,VM.Config.Network,VM.Config.Options,VM.Console,VM.GuestAgent.Audit,VM.Migrate,VM.PowerMgmt"
)

# Service accounts with one API token each (privilege-separated):
#   "userid|role|acl-path|token-name|comment"
# Token secrets are printed ONCE to the console — store them in 1Password.
SERVICE_ACCOUNTS=(
  "terraform@pve|PhoenixTerraform|/|automation|Terraform (bpg/proxmox provider)"
  "claude-audit@pve|PVEAuditor|/|discovery|Read-only discovery (1Password: infrastructure/(Proxmox) Claude API)"
)

# ---------------------------------------------------------------------------
# ACME / TLS (optional stage). Requires the phoenixstack.net zone in Cloudflare
# and a Cloudflare API token with Zone:DNS:Edit (prompted, or env CF_API_TOKEN).
# ---------------------------------------------------------------------------
ACME_ENABLE="no"
ACME_EMAIL="${ROOT_EMAIL}"
ACME_DIRECTORY="https://acme-v02.api.letsencrypt.org/directory"

# ---------------------------------------------------------------------------
# Host packages
# ---------------------------------------------------------------------------
EXTRA_PACKAGES="jq curl htop iotop ncdu tmux lm-sensors ethtool smartmontools cifs-utils gdisk pciutils"
