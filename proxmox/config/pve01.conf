# =============================================================================
# PhoenixStack node config: pve01
#
# Single source of truth for prepare-iso.sh, pre-rebuild.sh and pve-bootstrap.sh.
# Bash syntax (sourced). NO SECRETS in this file — passwords and tokens are
# prompted at run time (or read from env vars) and never written to the repo.
#
# Lines containing REPLACE_ME must be filled in before use; the scripts refuse
# to run while any remain. The reasons behind these values are in ../README.md.
# =============================================================================

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
NODE_NAME="pve01"
NODE_DOMAIN="int.phoenixstack.net"     # internal names; real TLS via Cloudflare DNS-01
TIMEZONE="America/Denver"
ROOT_EMAIL="alerts@phoenixstack.net"   # root@pam's address and the recipient of every alert

# Installer locale
INSTALL_KEYBOARD="en-us"
INSTALL_COUNTRY="us"

# ---------------------------------------------------------------------------
# Boot disks (installer). The filter must match EXACTLY the two Intel SSDs.
# prepare-iso.sh runs `device-match` to prove it before building the ISO.
# ---------------------------------------------------------------------------
INSTALL_DISK_FILTER="ID_MODEL=INTEL_SSDSC2BF240A4L"
INSTALL_ZFS_RAID="raid1"               # mirror

# ZFS ARC cap (GiB). Host has 251 GiB; leave the rest for guests.
ZFS_ARC_MAX_GIB=24

# ---------------------------------------------------------------------------
# Management network (VLAN 10 is native/untagged on the switch port)
# ---------------------------------------------------------------------------
MGMT_CIDR="10.101.0.11/24"               # /24 from 2026-11-20 (was /23); must match UniFi
MGMT_GATEWAY="10.101.0.254"
MGMT_VLAN=""                           # empty = host IP untagged on vmbr0 (native VLAN)
DNS_SERVERS="10.101.0.254 1.1.1.1"     # UDM first (local records), Cloudflare fallback
NTP_SERVERS="time.cloudflare.com"

# Uplink NIC(s) identified by MAC, not name, so interface renames can't bite.
# Onboard Broadcom BCM57416 dual 10GBASE-T. MACs from the iDRAC inventory
# (NIC.Embedded.1-1-1 / NIC.Embedded.2-1-1), 2026-11-14.
#   Port 1: 4C:D9:8F:0C:15:3E   (uplink today)
#   Port 2: 4C:D9:8F:0C:15:3F   (add here + set 802.3ad for a LAG later)
UPLINK_MACS="4C:D9:8F:0C:15:3E"
BOND_MODE="active-backup"              # active-backup | 802.3ad (needs switch LAG)
BRIDGE_VIDS="2-4094"                   # VLANs allowed on vmbr0 (switch port profile also limits)

# Admin source networks allowed to reach the GUI (8006), SSH and SPICE.
# Everything else inbound to the host is dropped.
ADMIN_SOURCES=(
  # Not the mgmt subnet: UniFi DHCP gives guests addresses there (10.101.0.0/24), and
  # guests must not reach the host's admin ports. Matches the UDM's Management zone rules
  # (2026-11-20): one workstation per site, and Teleport.
  "10.1.1.69/32|Aaron's admin workstation (AYOUNG-WKS-LIN, fixed IP in UniFi)"
  "10.2.1.69/32|Porter admin workstation (over the BPorter site-to-site VPN; fixed IP at that site)"
  "192.168.2.0/24|UniFi Teleport VPN clients (remote admin)"
)

# Log inbound packets the host firewall drops (nolog | info). Read them with:
#   tail -f /var/log/pve-firewall.log      (or GUI: pve01 → Firewall → Log)
FIREWALL_LOG_LEVEL_IN="info"

# Kernel command line additions
#   intel_iommu=on iommu=pt  GPU passthrough
#   l1tf=flush,nowarn        same L1TF mitigation as the default ("flush"); only stops KVM's
#                            per-boot "L1TF CPU bug present and SMT on" warning. Accepted
#                            risk R2 in ../README.md: remove it if R2 is revisited.
KERNEL_CMDLINE_ADD="intel_iommu=on iommu=pt l1tf=flush,nowarn"

# Quadro P2000 for passthrough to the Plex VM (all functions bound to vfio-pci, by device ID,
# so a host-driven 3070 later is unaffected). Leave empty to skip GPU passthrough setup.
# Slot 8 (moved from slot 3, where it was 0000:3b:00). iDRAC 2026-11-14 14:18: "GPU Controller
# in Slot 8", bus 177 = 0xb1 → CPU 2. If cards change, re-check with `lspci | grep -i nvidia`.
GPU_PCI_ADDR="0000:b1:00"
# Cluster resource mapping name for that GPU. Guests use "hostpci0: mapping=GPU01"
# (PLEX-TEMP's restored config expects this name). Empty = no mapping.
GPU_MAPPING_ID="GPU01"

# ---------------------------------------------------------------------------
# Root SSH keys (public keys only). Used by the installer and the bootstrap.
# ---------------------------------------------------------------------------
ROOT_SSH_KEYS=(
  "ssh-rsa "
)

# ---------------------------------------------------------------------------
# Guest + backup ZFS pools (created by the 'storage' stage)
# Disks by /dev/disk/by-id — verify with: ls -l /dev/disk/by-id/
# ---------------------------------------------------------------------------
ZFS_POOLS="nvme ssd backup"

# 2x Micron 7300 PRO 960G NVMe — VM disks. Enterprise drives with power-loss protection.
# Each on its own single M.2 adapter (heatsinks fitted): slots 5 and 7, so the mirror
# survives an adapter failure. by-id paths follow the drive, not the slot.
ZFS_POOL_nvme_LAYOUT="mirror
  /dev/disk/by-id/nvme-Micron_7300_MTFDHBA960TDF_20222D84258A
  /dev/disk/by-id/nvme-Micron_7300_MTFDHBA960TDF_20222D8418A0"
ZFS_POOL_nvme_PROPS=""

# 2 of the 4x Micron 256G SATA SSDs — small general tier (~238G): templates, light
# containers. Interim until the 'data' pool arrives; can be retired after that.
ZFS_POOL_ssd_LAYOUT="mirror
  /dev/disk/by-id/ata-MTFDDAK256MAM-1K12_14100C07C394
  /dev/disk/by-id/ata-MTFDDAK256MAM-1K12_14100C077C18"
ZFS_POOL_ssd_PROPS=""

# 4x Seagate 1.2TB SAS — backup tier for Proxmox Backup Server
# (MegaRAID must be in eHBA/JBOD mode so ZFS sees raw disks)
# + the other 2 Micron 256G SATA SSDs as a mirrored SPECIAL vdev: all pool metadata lives
#   on SSD, so PBS garbage collection, verify and browsing don't crawl on spinning disks.
#   It is pool-critical (losing both SSDs loses the pool), hence the mirror. It must exist
#   when the pool is created: metadata written before it was added stays on the HDDs.
#   Metadata only (special_small_blocks unset). zpool create -f accepts the mixed layout.
ZFS_POOL_backup_LAYOUT="raidz1
  /dev/disk/by-id/wwn-0x5000c500a7c0f787
  /dev/disk/by-id/wwn-0x5000c500a7c0fb07
  /dev/disk/by-id/wwn-0x5000c500a7c102d7
  /dev/disk/by-id/wwn-0x5000c500a7c0f7cb
special mirror
  /dev/disk/by-id/ata-MTFDDAK256MAM-1K12_14100C07790A
  /dev/disk/by-id/ata-MTFDDAK256MAM-1K12_14100C0778A5"
ZFS_POOL_backup_PROPS="compression=zstd"

# FUTURE — 'data' pool: Samsung 990 Pro 1TB drives on the ASUS Hyper M.2 card, grown from
# 1 to 2 to 4 drives. Steps: "The data pool" in ../README.md. To start: fill the by-id path,
# uncomment these lines and the matching ones below, and add 'data' to ZFS_POOLS.
# ZFS_POOL_data_LAYOUT="
#   /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_1TB_REPLACE_ME"
# ZFS_POOL_data_PROPS=""

# Extra datasets: "name prop=value ..."
ZFS_DATASETS=(
  "backup/pbs recordsize=1M"
  # FUTURE (with the data pool): model files are large, written once, already compressed.
  # primarycache=metadata keeps a 60 GB model load from flushing VM data out of the ARC.
  # "data/models recordsize=1M compression=off primarycache=metadata quota=600G"
)

# Cap the boot pool's /var/lib/vz so it can't fill the OS disks again (was 257G).
LOCAL_VZ_QUOTA="32G"
LOCAL_CONTENT="iso,vztmpl,snippets"
REMOVE_LOCAL_ZFS="yes"                 # no guest disks on the boot pool

# Proxmox storage entries for the guest pools: "id|pool|content"
PVE_ZFS_STORAGES=(
  "nvme|nvme|images,rootdir"
  "ssd|ssd|images,rootdir"
  # "data|data|images,rootdir"         # FUTURE: with the data pool
)

# ---------------------------------------------------------------------------
# NAS (UniFi UNAS Pro) — CIFS mounts managed in /etc/fstab
#   "id|share/path|pve-content-or-none|mount-opts-override"
# Mounted at /mnt/nas/<id>. Content 'none' = host mount only (e.g. LXC bind mounts).
# Password prompted at apply (or env NAS_SMB_PASSWORD); stored root-only on host.
# ---------------------------------------------------------------------------
NAS_SERVER="10.101.0.101"
NAS_SMB_USER="svc_proxmox"
NAS_SMB_VERSION="3.1.1"
NAS_MOUNTS=(
  "nas-iso|Media/Software/ISO|iso,vztmpl|"
  "nas-dump|Backups/pve01|backup|"
  # Host-only mounts (no PVE storage) bind-mounted read-write into unprivileged
  # docker-temp (999). Owner = container root (100000), group = container gid 1000
  # (101000), so its apps can write (Immich keeps its library on Porter).
  "media|Media|none|uid=100000,gid=101000,file_mode=0770,dir_mode=0770"
  "porter|Porter|none|uid=100000,gid=101000,file_mode=0770,dir_mode=0770"
)
# Retention for nas-dump, the nightly off-host copy. See "Backup design" in ../README.md.
NAS_DUMP_PRUNE="keep-daily=7"

# ---------------------------------------------------------------------------
# Access: people, roles, service accounts
# ---------------------------------------------------------------------------
# Personal admins (pve realm, member of 'admins' → Administrator on /).
# Password is prompted when the user is created; enroll TOTP in the GUI after.
ADMIN_USERS=(
  "aaron@pve|ayoung@phoenixstack.net|Aaron Young"   # userid|email|full name
)

# Resource pools: "poolid|comment". Terraform creates every guest in pool `terraform` and has
# guest permissions only there, so it can't touch guests outside it (the -TEMP guests).
PVE_POOLS=(
  "terraform|Guests created and managed by Terraform (L5)"
  "templates|VM templates: Terraform may only read and clone them"
)

# Custom roles: "name|priv,priv,..."  (unknown privileges are dropped with a warning)
#   PhoenixTerraform — granted on /pool/terraform only: create, change and delete guests in the
#   pool (Pool.Allocate is needed to put a new guest in it). No Sys.*, no consoles, no migration.
PVE_ROLES=(
  "PhoenixTerraform|Pool.Allocate,Pool.Audit,VM.Allocate,VM.Audit,VM.Clone,VM.Config.CDROM,VM.Config.CPU,VM.Config.Cloudinit,VM.Config.Disk,VM.Config.HWType,VM.Config.Memory,VM.Config.Network,VM.Config.Options,VM.GuestAgent.Audit,VM.PowerMgmt"
)

# Service accounts with one API token each (privilege-separated):
#   "userid|grants|token-name|comment"   grants: space-separated "path=role"
# The user and its token get exactly these grants: any other ACL entry for them is removed.
# Token secrets are printed ONCE to the console — store them in 1Password.
#   terraform: guests in its pool; clone (only) the VM templates; disks on ssd/nvme; templates and
#   snippets on local (use, not upload: a VM that references the cloud-init vendor snippet needs
#   Datastore.AllocateSpace there; local holds no guest disks); NICs only on VLAN 100 (Services) and
#   200 (DMZ), never untagged on mgmt; node status (read).
SERVICE_ACCOUNTS=(
  "terraform@pve|/pool/terraform=PhoenixTerraform /pool/templates=PVETemplateUser /storage/ssd=PVEDatastoreUser /storage/nvme=PVEDatastoreUser /storage/local=PVEDatastoreUser /sdn/zones/localnetwork/vmbr0/100=PVESDNUser /sdn/zones/localnetwork/vmbr0/200=PVESDNUser /nodes/pve01=PVEAuditor|automation|Terraform (bpg/proxmox provider)"
  "claude-audit@pve|/=PVEAuditor|discovery|Read-only discovery (1Password: infrastructure/(Proxmox) Claude API)"
)

# LXC templates kept on a storage: "storage|name-prefix". The newest matching template in the
# Proxmox appliance index is downloaded when none is present (stage `templates`).
LXC_TEMPLATES=(
  "local|debian-13-standard"
)

# VM templates built from a cloud image (stage `templates`, after `access` creates the pool):
#   "vmid|name|disk-storage|pool|vlan|image-base-url|image-file"
# The image is checked against the SHA512SUMS file published next to it, imported as the
# template's disk, and given a cloud-init drive. Terraform full-clones it, so the template can
# be rebuilt (qm destroy <vmid>, re-run the stage) without touching existing guests.
# The NIC is tagged VLAN 100 so a fresh clone never sits untagged on mgmt; Terraform sets the
# real VLAN.
VM_TEMPLATES=(
  "10001|debian13-cloud|ssd|templates|100|https://cloud.debian.org/images/cloud/trixie/latest|debian-13-genericcloud-amd64.qcow2"
)
# Cloud-init vendor data on storage `local` (snippets), attached to every VM template:
# installs the QEMU guest agent at first boot (the Debian cloud image doesn't include it).
CI_VENDOR_SNIPPET="phoenix-vendor.yaml"

# ---------------------------------------------------------------------------
# Notifications (optional stage `notify`): PVE notification system -> SMTP relay (Brevo).
# The SMTP login, From address and SMTP key are NOT kept here (public repository):
# they're prompted at apply, or read from env NOTIFY_SMTP_USER / NOTIFY_SMTP_FROM /
# NOTIFY_SMTP_PASSWORD. The From address must be a verified sender in Brevo.
# If the verified sender changes: run the notify and pbs stages with env NOTIFY_SMTP_FROM
# set to the new address. Both targets (PVE and PBS) are updated and re-tested.
# ---------------------------------------------------------------------------
NOTIFY_SMTP_ENABLE="yes"
NOTIFY_SMTP_NAME="brevo"
NOTIFY_SMTP_SERVER="smtp-relay.brevo.com"
NOTIFY_SMTP_PORT="587"
NOTIFY_SMTP_MODE="starttls"
NOTIFY_MAILTO="${ROOT_EMAIL}"
NOTIFY_SEVERITIES="warning,error"      # failed backups, ZFS/disk errors, etc.
NOTIFY_ALL_BACKUP_JOBS="yes"           # every backup result, successes too. Set "no" once
                                       # the new jobs have proven themselves.
NOTIFY_PACKAGE_UPDATES="yes"           # email when the daily update check finds new packages
                                       # (matcher phoenix-updates; notify package-updates=always)
NOTIFY_MAIL_TO_ROOT="off"              # built-in mail-to-root targets (PVE and PBS): the host's local
                                       # mail can't deliver off-host, so root's mail goes through
                                       # the SMTP target instead (matcher phoenix-system-mail).

# ---------------------------------------------------------------------------
# Proxmox Backup Server on this host (stage `pbs`). Datastore on the backup pool.
# Pruning is server-side, so the PVE storage keeps all and the token can't delete.
# Calendar events use PBS/systemd syntax.
# ---------------------------------------------------------------------------
PBS_ENABLE="yes"
PBS_DATASTORE="pve01-local"
PBS_DATASTORE_PATH="/backup/pbs"              # ZFS dataset backup/pbs (recordsize 1M)
PBS_GC_SCHEDULE="*-*-* 04:30"
PBS_PRUNE_SCHEDULE="*-*-* 04:00"
PBS_KEEP="keep-daily=14,keep-weekly=8,keep-monthly=6"
PBS_VERIFY_SCHEDULE="sat 05:00"
PBS_VERIFY_OUTDATED_DAYS=30
PBS_USER="pve01@pbs"
PBS_TOKEN="backup"
PBS_PVE_STORAGE="pbs-local"

# ---------------------------------------------------------------------------
# Backup jobs (stage `backups`): all guests, snapshot mode, alerts via `notify`.
# id|schedule|storage|extra pvesh options|comment. Retention: PBS prune job for
# pbs-local, NAS_DUMP_PRUNE (keep-daily=7) for nas-dump.
# ---------------------------------------------------------------------------
BACKUP_JOBS=(
  "nightly-pbs|01:00|pbs-local||Nightly to local PBS (long history, fast restores)"
  "nightly-nas|03:30|nas-dump|--compress zstd|Nightly off-host copy to the NAS (7 days)"
)

# ---------------------------------------------------------------------------
# ACME / TLS (optional stage): Let's Encrypt certificates for the PVE GUI (8006) and, with
# PBS_ENABLE, the PBS GUI (8007). The storage pbs-local is then re-created to reach PBS by
# name instead of 127.0.0.1 with a pinned fingerprint. Requires the phoenixstack.net zone in Cloudflare and a
# Cloudflare API token limited to that zone, with DNS:Edit and Zone:Read (prompted, or env
# CF_API_TOKEN). The token is in 1Password: infrastructure / "Cloudflare PVE Token".
# ---------------------------------------------------------------------------
ACME_ENABLE="yes"
ACME_EMAIL="${ROOT_EMAIL}"
ACME_DIRECTORY="https://acme-v02.api.letsencrypt.org/directory"

# ---------------------------------------------------------------------------
# Host packages
# ---------------------------------------------------------------------------
EXTRA_PACKAGES="jq curl htop iotop ncdu tmux lm-sensors ethtool smartmontools cifs-utils gdisk pciutils"
