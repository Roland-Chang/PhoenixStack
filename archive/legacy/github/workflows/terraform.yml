name: Terraform Plan & Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

env:
  TERRAFORM_VERSION: "1.5"
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  # ============================================================================
  # VALIDATE: Check Terraform syntax and security
  # ============================================================================
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize Terraform (root)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Validate syntax
        working-directory: terraform
        run: terraform validate

  # ============================================================================
  # PLAN: Run terraform plan on PR
  # ============================================================================
  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TF_VAR_proxmox_api_url: op://infrastructure/Proxmox/api-url
          TF_VAR_proxmox_api_token_id: op://infrastructure/Proxmox/api-token-id
          TF_VAR_proxmox_api_token_secret: op://infrastructure/Proxmox/api-token-secret

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Plan infrastructure changes
        working-directory: terraform
        id: plan
        run: |
          # Run plan for each service (dry-run, no backend needed)
          for service in ansible01 dns01 proxy01 authentik01 docker01 plex01; do
            if [ -d "$service" ]; then
              echo "Planning $service..."
              terraform plan -no-color -out=tfplan_$service $service 2>&1 | tee plan_output_$service.txt
            fi
          done

      - name: Comment PR with plan summary
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const services = ['ansible01', 'dns01', 'proxy01', 'authentik01', 'docker01', 'plex01'];
            let comment = '## Terraform Plan Summary\n\n';
            
            for (const service of services) {
              const planOutput = `plan_output_${service}.txt`;
              if (fs.existsSync(planOutput)) {
                const content = fs.readFileSync(planOutput, 'utf8');
                comment += `### ${service}\n\`\`\`\n${content}\n\`\`\`\n\n`;
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================================================
  # APPLY: Run terraform apply on merge to main
  # ============================================================================
  apply:
    name: Terraform Apply
    needs: validate
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init

      - name: Load secrets from 1Password (self-hosted runner)
        run: |
          # Load 1Password service account token from local file
          export OP_SERVICE_ACCOUNT_TOKEN=$(cat /etc/phoenixstack/1password_token)
          
          # Fetch Proxmox credentials from 1Password vault
          echo "TF_VAR_proxmox_api_url=$(op read op://infrastructure/Proxmox/api-url)" >> $GITHUB_ENV
          echo "TF_VAR_proxmox_api_token_id=$(op read op://infrastructure/Proxmox/api-token-id)" >> $GITHUB_ENV
          echo "TF_VAR_proxmox_api_token_secret=$(op read op://infrastructure/Proxmox/api-token-secret)" >> $GITHUB_ENV

      - name: Apply infrastructure changes
        working-directory: terraform
        run: |
          echo "⚠️ Terraform apply triggered on main branch"
          echo "Running on self-hosted runner: $(hostname)"
          echo "State stored locally on bastion01"
          terraform apply -auto-approve
