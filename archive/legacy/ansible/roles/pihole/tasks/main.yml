- name: "Display docker compose output"
  debug:
    msg: "{{ compose_result.stdout }}"
  when: compose_result.stdout

- name: "Wait for PiHole to be ready"
  wait_for:
    port: 53
    delay: 20
    timeout: 180
    host: "127.0.0.1"
  ignore_errors: yes

- name: "Verify PiHole container is running"
  shell: |
    docker ps | grep pihole-pihole-1 | grep -q "Up" && echo "running"
  register: dig_result
  retries: 5
  delay: 5
  until: dig_result.rc == 0 and "running" in dig_result.stdout

- name: "Set PiHole web interface password"
  shell: |
    docker exec pihole-pihole-1 pihole setpassword "{{ pihole_web_password }}"
  register: setpass_result
  retries: 3
  delay: 5
  until: setpass_result.rc == 0

- name: "Display PiHole access information"
  debug:
    msg: |
      ╔══════════════════════════════════════════╗
      ║  PiHole Installation Complete            ║
      ╚══════════════════════════════════════════╝
      Web Interface: http://{{ inventory_hostname }}/admin
      Default Username: admin
      Password: {{ pihole_web_password | default('changeme') }}
      
      Verify DNS Resolution:
        dig @{{ inventory_hostname }} google.com +short
      
      Configure clients to use:
        Primary DNS: {{ inventory_hostname }}
        Secondary DNS: (configure other DNS server)
